name: Release image

# Builds the official image for linux/amd64 and linux/arm64 and, ONLY when a release is published (or when started by hand with `push` on), publishes it to ghcr.io with an attestation of its
# provenance. Started by hand with `push` off (the default) it builds both platforms and pushes nothing: that is how the workflow is tried before a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io (off = build only, nothing leaves the runner)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build${{ (github.event_name == 'release' || inputs.push) && ' and publish' || '' }} the image (amd64, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read        # the checkout
      packages: write       # push to ghcr.io
      id-token: write       # the attestation of the provenance
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'release' || inputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The version of the monitor, and the tags of the image
        id: version
        run: |
          version="$(python3 -c "import re,sys; print(re.search(r'TOOL_VERSION = \"([0-9.]+)\"', open('monitor/src/github_actions_monitor/tool_version.py', encoding='utf-8').read()).group(1))")"
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v${version}" ]; then
            echo "the release ${{ github.event.release.tag_name }} is not the version of the code (v${version})"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names and labels of the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest

      - name: Build for both platforms${{ (github.event_name == 'release' || inputs.push) && ' and push' || ' (nothing is pushed)' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attestation of the provenance of the image
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
