name: Release image

# Builds the official image for linux/amd64 and linux/arm64 and, ONLY when a version tag is pushed (or when started by hand with `push` on), publishes it to ghcr.io with an attestation of its
# provenance. Started by hand with `push` off (the default) it builds both platforms and pushes nothing: that is how the workflow is tried before a release.
# The release of GitHub waits for the package: it is created as a DRAFT with the tag, and the last job publishes it only after the image of that version is in the registry and answers by tag.
# A release that is not a draft (published by hand) is left as it is.
# Only actions of GitHub itself are used (the settings of this repository allow no others): the build is the docker and buildx that the runner already has.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io (off = build only, nothing leaves the runner)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build the image for amd64 and arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read        # the checkout
      packages: write       # push to ghcr.io
      id-token: write       # the attestation of the provenance
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.push }}
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The version of the monitor, the name of the image and its tags
        id: names
        run: |
          version="$(python3 -c "import re; print(re.search(r'TOOL_VERSION = \"([0-9.]+)\"', open('monitor/src/github_actions_monitor/tool_version.py', encoding='utf-8').read()).group(1))")"
          if [ "$EVENT" = "push" ] && [ "$TAG" != "v${version}" ]; then
            echo "the tag ${TAG} is not the version of the code (v${version})"; exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags=${image}:${version} ${image}:${version%.*} ${image}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Emulation for arm64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support

      - name: A builder that builds both platforms
        run: |
          docker buildx create --name release --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build for both platforms${{ (github.event_name == 'push' || inputs.push) && ' and push' || ' (nothing is pushed)' }}
        id: build
        env:
          VERSION: ${{ steps.names.outputs.version }}
          TAGS: ${{ steps.names.outputs.tags }}
        run: |
          tag_args=""
          for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
          if [ "$PUBLISH" = "true" ]; then output="--push"; else output="--output type=cacheonly"; fi
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64,linux/arm64 --file deploy/Dockerfile --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" $tag_args $output --metadata-file build.json .
          digest="$(python3 -c "import json; print(json.load(open('build.json')).get('containerimage.digest', ''))")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attestation of the provenance of the image
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
    outputs:
      version: ${{ steps.names.outputs.version }}
      image: ${{ steps.names.outputs.image }}

  release:
    name: Publish the release once the image is in the registry
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # edit the release: a draft becomes public
      packages: read        # ask the registry for the image
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.image.outputs.version }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: The image of this version answers by its tag
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > inspect.txt 2>&1; then break; fi
            if [ "$attempt" = 6 ]; then cat inspect.txt; echo "the image ${IMAGE}:${VERSION} is not in the registry: the release stays a draft"; exit 1; fi
            sleep 20
          done
          grep -q "linux/amd64" inspect.txt && grep -q "linux/arm64" inspect.txt || { cat inspect.txt; echo "the image lacks a platform: the release stays a draft"; exit 1; }

      - name: Publish the draft release (a release that is not a draft is left as it is)
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$draft" in
            true) gh release edit "$TAG" --draft=false --latest; echo "published ${TAG} after the image" ;;
            false) echo "${TAG} was already public: nothing to do" ;;
            *) echo "there is no release ${TAG} yet: create it as a draft and the next run of this workflow publishes it" ;;
          esac
