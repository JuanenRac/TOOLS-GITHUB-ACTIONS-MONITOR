name: Demo site

# Builds the static demo (invented data only) and the browser workflow check, opens both in a real browser, and keeps them as an artifact.
# A second job photographs the boxes of the optional parts for docs/screenshots (an artifact too: nothing is committed by the workflow).
# It publishes NOTHING: putting the folder on a web address is a decision of the owner of the repository and a separate step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/make_public_demo.py
      - tools/demo_monitor.py
      - tools/demo_parts.py
      - tools/check_demo_site.py
      - tools/make_screenshots.py
      - .github/workflows/demo-site.yml

permissions:
  contents: read

concurrency:
  group: demo-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the static demo
        run: python tools/make_public_demo.py "$RUNNER_TEMP/demo-site"
      - name: The demo answers and carries no real account
        run: |
          test -s "$RUNNER_TEMP/demo-site/index.html"
          test -s "$RUNNER_TEMP/demo-site/data/data.json"
          test -s "$RUNNER_TEMP/demo-site/lint/monitor.zip"
          ! grep -rIl -e "$HOME/" -e "$GITHUB_WORKSPACE" "$RUNNER_TEMP/demo-site/data" "$RUNNER_TEMP/demo-site/index.html"
      - name: The demo and the workflow check work in a browser (Python in the browser comes from the public CDN of Pyodide)
        run: python tools/check_demo_site.py "$RUNNER_TEMP/demo-site" --require
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-site
          path: ${{ runner.temp }}/demo-site
          retention-days: 7

  pictures:
    name: Pictures of the optional parts
    runs-on: windows-latest      # the pictures of docs/screenshots are taken with Edge on Windows
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tools of the picture maker, pinned
        run: python -m pip install websockets==15.0.1 pillow==11.3.0
      - name: Photograph the boxes with the invented data
        env:
          PYTHONUTF8: "1"
        run: >-
          python tools/make_screenshots.py --web --only web_extensions web_proposals web_assistant_chat web_collaboration web_roles_groups web_posture web_screen_group web_sentinel_security web_compliance web_external_ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pictures
          path: |
            docs/screenshots/web_extensions_*.png
            docs/screenshots/web_proposals_*.png
            docs/screenshots/web_assistant_chat_*.png
            docs/screenshots/web_collaboration_*.png
            docs/screenshots/web_roles_groups_*.png
            docs/screenshots/web_posture_*.png
            docs/screenshots/web_compliance_*.png
            docs/screenshots/web_external_ci_*.png
            docs/screenshots/web_screen_group.png
            docs/screenshots/web_sentinel_security_*.png
          if-no-files-found: error
          retention-days: 7
