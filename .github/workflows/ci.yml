name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rich, for the optional terminal view (the monitor itself needs no package)
        run: python -m pip install rich
      - name: Unit tests (offline)
        run: python -m unittest discover -s monitor/tests

  pictures:
    name: Pictures and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pictures agree with their description files
        run: |
          python tools/make_architecture.py --check
          python tools/make_structure.py --check
          python tools/make_settings_doc.py --check
