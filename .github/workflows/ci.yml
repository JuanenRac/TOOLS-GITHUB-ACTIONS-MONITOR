name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rich and Textual, for the optional terminal views (the monitor itself needs no package)
        run: python -m pip install rich textual
      - name: Unit tests (offline)
        run: python -m unittest discover -s monitor/tests

  pictures:
    name: Pictures and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The pictures agree with their description files
        run: |
          python tools/make_architecture.py --check
          python tools/make_structure.py --check
          python tools/make_settings_doc.py --check
          python tools/sync_changelog.py --check
          python tools/make_help_index.py --check

  container:
    name: The example container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image of deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t github-actions-monitor .
      - name: The monitor and the GitHub CLI are in the image
        run: |
          docker run --rm github-actions-monitor python -c "import actions_monitor, tool_version; print(tool_version.TOOL_VERSION)"
          docker run --rm github-actions-monitor gh --version
