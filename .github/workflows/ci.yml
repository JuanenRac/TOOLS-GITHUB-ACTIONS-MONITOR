name: CI

# What runs where: every pull request, every push to main, every tag and the nightly run test on Ubuntu and Windows. A new push to the same pull request cancels the run it supersedes;
# main, tags and the nightly run are never cancelled.
# macOS is not tested for now: its job was taken out of this workflow and support for it will be taken up again later.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Rich and Textual, for the optional terminal views (the monitor itself needs no package)
        run: python -m pip install -r .github/ci-requirements.txt
      - name: Unit tests (offline)
        run: python -m unittest discover -s monitor/tests

  offline:
    name: Tests with the network cut
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The suite in a namespace with only the loopback (a test that needs the internet is a defect)
        run: sh tools/run_offline_tests.sh discover -s monitor/tests

  dependencies:
    name: Audit of dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The auditor, pinned
        run: python -m pip install pip-audit==2.9.0
      - name: Known vulnerabilities in the packages the CI installs (a suppression has a reason and an expiry; a dead or expired one fails)
        run: python tools/audit_dependencies.py

  limits:
    name: The monitor in a container of one processor and 512 MB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: An account of 120 workflows against the real server, with the limits of a small container
        run: docker run --rm --cpus 1 --memory 512m --memory-swap 512m -v "$PWD":/work:ro -w /work -e PYTHONDONTWRITEBYTECODE=1 python:3.13-slim python tools/limits_check.py

  pictures:
    name: Pictures and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The pictures agree with their description files
        run: |
          python tools/make_architecture.py --check
          python tools/make_structure.py --check
          python tools/make_settings_doc.py --check
          python tools/sync_changelog.py --check
          python tools/make_help_index.py --check
          python tools/make_glance.py --check
          python tools/check_contrast.py      # every text on every surface of every theme reaches 4.5:1, the states 3:1, the colour-blind palette keeps them apart
      - name: The demo holds the frozen contract of the read API, complete and lite
        run: |
          python tools/demo_monitor.py 18871 &
          python tools/demo_monitor.py 18872 --lite &
          for port in 18871 18872; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && break; sleep 1; done
          done
          python monitor/tools/check_api_contract.py --url http://127.0.0.1:18871
          python monitor/tools/check_api_contract.py --lite --url http://127.0.0.1:18872
      - name: The demo passes the contract suite for clients (the service mode switches the read API on)
        run: |
          MONITOR_SERVICE=1 python tools/demo_monitor.py 18873 &
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:18873/api/health" >/dev/null 2>&1 && break; sleep 1; done
          python monitor/tools/api_contract_suite.py --url http://127.0.0.1:18873

  browser:
    name: The page in a browser (eight languages, every tab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true      # the fonts of a runner differ from the ones of a desktop: this job reports, it does not turn the CI red
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: No text leaves its box, the Quota tab included, the sound logic, the bottom bar in one line, the loading box and the unfolded panel of the sentinels
        env:
          MONITOR_BROWSER_TESTS: "1"
        run: python -m unittest discover -s monitor/tests -p "test_overflow.py" && python -m unittest discover -s monitor/tests -p "test_190_charts.py" && python -m unittest discover -s monitor/tests -p "test_286_status_labels.py" && python -m unittest discover -s monitor/tests -p "test_mon93_unfolded.py" && python -m unittest discover -s monitor/tests -p "test_177_sound.py" && python -m unittest discover -s monitor/tests -p "test_ui_bar_and_loading.py" && python -m unittest discover -s monitor/tests -p "test_181_load_and_reload.py" && python -m unittest discover -s monitor/tests -p "test_mon216_report.py"

  page:
    name: The page works in a browser (every tab, every sub-tab of Settings, no error)
    runs-on: ubuntu-latest      # a failure here turns the CI red
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Open the page, go through every tab and raise nothing (a page broken on purpose must fail; the lamps move, or stand still when asked)
        env:
          MONITOR_BROWSER_TESTS: "1"
          MONITOR_REQUIRE_BROWSER: "1"
        run: |
          python -m unittest discover -s monitor/tests -p "test_180_page_smoke.py" -v
          python -m unittest discover -s monitor/tests -p "test_180_motion.py" -v
          python -m unittest discover -s monitor/tests -p "test_183_now_panel.py" -v
          python -m unittest discover -s monitor/tests -p "test_216_fold_memory_browser.py" -v
          python -m unittest discover -s monitor/tests -p "test_194_sort_now.py" -v
          python -m unittest discover -s monitor/tests -p "test_196_sort_alerts.py" -v
          python -m unittest discover -s monitor/tests -p "test_195_ports.py" -v
          python -m unittest discover -s monitor/tests -p "test_mon102_page_5xx.py" -v
      - name: The wall screens in every language and size, the screens page, the notification page, the AI preset page and the skipped list
        env:
          MONITOR_BROWSER_TESTS: "1"
          MONITOR_REQUIRE_BROWSER: "1"
        run: |
          python -m unittest discover -s monitor/tests -p "test_207_wall_screens_browser.py" -v
          python -m unittest discover -s monitor/tests -p "test_187_screens.py" -v
          python -m unittest discover -s monitor/tests -p "test_186_skipped.py" -v
          python -m unittest discover -s monitor/tests -p "test_188_notify_page.py" -v
          python -m unittest discover -s monitor/tests -p "test_194_ai_preset_page.py" -v
          python -m unittest discover -s monitor/tests -p "test_screens_rotation_browser.py" -v

  screens:
    name: The wall screens fit (every language, every kind of data, one size at a time)
    runs-on: ubuntu-latest      # a text that leaves its box, two that cover each other or a page that scrolls turns the CI red
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        size: [1080p, 1440p, 4K, ultrawide, superwide, portrait, portrait4K]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Measure the three wall screens in the eight languages with the invented data, the worst data and no data, and the safe margin
        env:
          MONITOR_BROWSER_TESTS: "1"
          MONITOR_REQUIRE_BROWSER: "1"
          MONITOR_SCREENS_MATRIX: ${{ matrix.size }}
        run: python -m unittest discover -s monitor/tests -p "test_763_screens_fit.py" -v

  container:
    name: The image builds, runs read-only without root and survives a revoked login
    runs-on: ubuntu-24.04      # the runner image is fixed: the test starts a container and reads the logs of a service
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image of deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t github-actions-monitor .
      - name: The monitor and the GitHub CLI are in the image
        run: |
          docker run --rm --entrypoint python github-actions-monitor -c "from github_actions_monitor.app import actions_monitor; from github_actions_monitor import tool_version; print(tool_version.TOOL_VERSION)"
          docker run --rm --entrypoint gh github-actions-monitor --version
      - name: Start it read-only and as a service, revoke a login, replace it without a restart, send SIGHUP
        run: bash deploy/test/container_test.sh github-actions-monitor
