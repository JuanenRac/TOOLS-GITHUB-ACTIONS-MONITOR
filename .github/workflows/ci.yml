name: CI

# What runs where: every pull request runs Ubuntu and Windows. macOS (the slowest and the scarcest runner) runs on a push to main, on a tag, every night, by hand, and on a pull request
# that carries the label `full-ci`. A new push to the same pull request cancels the run it supersedes; main, tags and the nightly run are never cancelled.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"      # a macOS job never spends minutes updating Homebrew
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Rich and Textual, for the optional terminal views (the monitor itself needs no package)
        run: python -m pip install -r .github/ci-requirements.txt
      - name: Unit tests (offline)
        run: python -m unittest discover -s monitor/tests

  tests-macos:
    name: Tests (macos-15, Python ${{ matrix.python }})
    # not on every pull request: a push to main, a tag, the nightly run, a manual run, or a pull request with the label `full-ci`
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-15      # Apple Silicon, fixed: the moving label of the latest macOS changes image without notice
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Rich and Textual, for the optional terminal views (the monitor itself needs no package)
        run: python -m pip install -r .github/ci-requirements.txt
      - name: Unit tests (offline)
        run: python -m unittest discover -s monitor/tests

  pictures:
    name: Pictures and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: The pictures agree with their description files
        run: |
          python tools/make_architecture.py --check
          python tools/make_structure.py --check
          python tools/make_settings_doc.py --check
          python tools/sync_changelog.py --check
          python tools/make_help_index.py --check
          python tools/make_glance.py --check

  browser:
    name: The page in a browser (eight languages, every tab)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true      # the fonts of a runner differ from the ones of a desktop: this job reports, it does not turn the CI red
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: No text leaves its box, the Quota tab included, the sound logic, the bottom bar in one line and the loading box
        env:
          MONITOR_BROWSER_TESTS: "1"
        run: python -m unittest discover -s monitor/tests -p "test_overflow.py" && python -m unittest discover -s monitor/tests -p "test_177_sound.py" && python -m unittest discover -s monitor/tests -p "test_ui_bar_and_loading.py" && python -m unittest discover -s monitor/tests -p "test_181_load_and_reload.py"

  page:
    name: The page works in a browser (every tab, every sub-tab of Settings, no error)
    runs-on: ubuntu-latest      # a failure here turns the CI red
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Open the page, go through every tab and raise nothing (a page broken on purpose must fail; the lamps move, or stand still when asked)
        env:
          MONITOR_BROWSER_TESTS: "1"
          MONITOR_REQUIRE_BROWSER: "1"
        run: |
          python -m unittest discover -s monitor/tests -p "test_180_page_smoke.py" -v
          python -m unittest discover -s monitor/tests -p "test_180_motion.py" -v
          python -m unittest discover -s monitor/tests -p "test_183_now_panel.py" -v

  container:
    name: The image builds, runs read-only without root and survives a revoked login
    runs-on: ubuntu-24.04      # the runner image is fixed: the test starts a container and reads the logs of a service
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image of deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t github-actions-monitor .
      - name: The monitor and the GitHub CLI are in the image
        run: |
          docker run --rm --entrypoint python github-actions-monitor -c "from github_actions_monitor.app import actions_monitor; from github_actions_monitor import tool_version; print(tool_version.TOOL_VERSION)"
          docker run --rm --entrypoint gh github-actions-monitor --version
      - name: Start it read-only and as a service, revoke a login, replace it without a restart, send SIGHUP
        run: bash deploy/test/container_test.sh github-actions-monitor
