name: m39 temporary
# temporary: runs every browser test on Windows once; removed before the merge
on:
  pull_request:
permissions:
  contents: read
jobs:
  all:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: packages
        run: python -m pip install -r .github/ci-requirements.txt websockets==15.0.1
      - name: every browser test, as the local gate runs them
        shell: bash
        env:
          MONITOR_BROWSER_TESTS: "1"
          PYTHONUTF8: "1"
        run: |
          fail=0
          for f in $(grep -lE "check_overflow|check_page|check_mobile|check_screens|check_charts|check_pills|check_unfolded|check_motion|msedge|edge\(\)" monitor/tests/test_*.py); do
            n=$(basename $f)
            [ "$n" = test_763_screens_fit.py ] && continue
            echo "=== $n"
            python -m unittest discover -s monitor/tests -p "$n" 2>&1 | tail -40 || fail=1
          done
          exit $fail
      - name: the page on a phone, every tab, with and without the optional parts
        if: always()
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python tools/check_mobile.py --lang en de ja || true
          python tools/check_overflow.py --lite --lang en de || true
