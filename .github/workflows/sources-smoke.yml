name: Smoke of external sources

# Once a week (and by hand): reads the public sources the monitor depends on - the status page of GitHub, the advisories, the description of the REST API and the last release of this project - and
# checks that the monitor still understands their format (tools/smoke_sources.py). Real services, not mocks. It reads public data with no token, writes nothing and publishes nothing; a red run means
# a source changed its format and a parser of the monitor must follow it.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sources-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: The sources still answer the format the monitor reads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read        # the checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read the four sources and judge their format
        run: python tools/smoke_sources.py
