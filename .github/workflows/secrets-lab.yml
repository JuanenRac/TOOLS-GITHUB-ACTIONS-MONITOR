# The reading of the GitHub token from a REAL HashiCorp Vault in development mode (in memory, thrown away with the runner). The Vault program is downloaded with a pinned SHA-256
# (tools/fetch_pinned.sh). No secret of the repository is used. A real cloud account or production Vault is not part of this.
name: Secrets lab

on:
  pull_request:
    paths:
      - "monitor/src/github_actions_monitor/security/secret_backends.py"
      - "monitor/src/github_actions_monitor/security/secretstore.py"
      - "monitor/tests/test_plugins_family.py"
      - "tools/fetch_pinned.sh"
      - ".github/workflows/secrets-lab.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vault:
    name: The token read from a Vault in development mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Start a Vault in development mode and read from it
        env:
          MONITOR_VAULT_LAB_ADDR: http://127.0.0.1:8200
          MONITOR_VAULT_LAB_ROOT: lab-only-root
        run: |
          sh tools/fetch_pinned.sh vault "$RUNNER_TEMP/vault"
          "$RUNNER_TEMP/vault/vault" server -dev -dev-root-token-id="$MONITOR_VAULT_LAB_ROOT" -dev-listen-address=127.0.0.1:8200 > "$RUNNER_TEMP/vault.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs "$MONITOR_VAULT_LAB_ADDR/v1/sys/health" > /dev/null && break; sleep 1; done
          cd monitor
          python -m unittest tests.test_plugins_family.VaultLab -v 2>&1 | tee "$RUNNER_TEMP/lab.log"
          if grep -q "skipped" "$RUNNER_TEMP/lab.log"; then echo "the test was skipped: nothing was proved"; exit 1; fi
