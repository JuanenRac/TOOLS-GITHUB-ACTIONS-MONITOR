name: Bug report
description: Report a reproducible defect of the monitor.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python monitor/leer_parte.py --version`.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web page, Sentinel (alerts), Command line tools, Batch dispatch, Metrics / exports, Configuration, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Never include tokens, passwords or private logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Sanitized output, operating system, Python version.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, personal data and private repository names.
          required: true
