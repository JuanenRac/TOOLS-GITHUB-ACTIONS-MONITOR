<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>GitHub Actions Monitor</title>
<style>
:root{--bg:#070d14;--bg2:#0c1622;--card:#101c2b;--card2:#0d1724;--line:#1d3047;--tx:#e6f1fb;--mut:#7f98b3;--cy:#22d3ee;--cy2:#0e7490;--ok:#34d399;--warn:#fbbf24;--bad:#fb4b4b;--info:#60a5fa;--glow:rgba(34,211,238,.18);--halo:rgba(251,75,75,.55)}
:root[data-theme=light]{--bg:#eef3f8;--bg2:#e3ebf3;--card:#ffffff;--card2:#f6f9fc;--line:#c9d6e3;--tx:#0b1b2b;--mut:#4d6580;--cy:#0891b2;--cy2:#155e75;--ok:#047857;--warn:#a16207;--bad:#c81e1e;--info:#1d4ed8;--glow:rgba(8,145,178,.14);--halo:rgba(200,30,30,.45)}
:root[data-theme=contrast]{--bg:#000;--bg2:#000;--card:#000;--card2:#000;--line:#ffffff;--tx:#fff;--mut:#e0e0e0;--cy:#00e5ff;--cy2:#00e5ff;--ok:#00ff7f;--warn:#ffd700;--bad:#ff4040;--info:#7ab8ff;--glow:rgba(255,255,255,.12);--halo:rgba(255,64,64,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html{--k:1;--d:1;font-size:calc(var(--k)*var(--d)*min(100vw/120,100vh/67.5));background:var(--bg);color:var(--tx)}
html[data-density=compact]{--d:.9}
html[data-density=large]{--d:1.12}
@media (orientation:portrait){html{font-size:calc(var(--k)*var(--d)*min(100vw/62,100vh/108))}}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));height:100vh;overflow:hidden;font-size:1rem;line-height:1.25;transition:filter 2s,opacity .6s}
body.dim{filter:brightness(.35)}
body.offline #stage{opacity:.5;filter:grayscale(.7)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:1rem 1.2rem .8rem;gap:.7rem;transition:transform 30s linear,opacity .6s,filter .6s}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.brand b{font-size:1.5rem;letter-spacing:.02em;white-space:nowrap}
.brand .tag{font-size:.95rem;color:var(--mut);border:1px solid var(--line);border-radius:.4rem;padding:.1rem .5rem;white-space:nowrap}
.pulse{width:.8rem;height:.8rem;border-radius:50%;background:var(--cy);box-shadow:0 0 .9rem var(--cy);flex:0 0 auto}
.clock{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:600;text-align:right;white-space:nowrap}
.clock small{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
.mid{flex:1;display:flex;justify-content:center;gap:.5rem;font-size:.9rem;color:var(--mut)}
.dots{display:flex;gap:.45rem;align-items:center}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--cy)}
#banner{flex:0 0 auto;border:1px solid var(--bad);color:var(--bad);border-radius:.5rem;padding:.35rem .8rem;font-weight:600;font-size:1.05rem;background:color-mix(in srgb,var(--bad) 12%,transparent)}
#banner[hidden]{display:none}
#banner.warn{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.screen{flex:1 1 0;min-height:0;display:grid;gap:.8rem;transition:opacity .6s}
.screen[hidden]{display:none}
.screen.out{opacity:0}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1rem;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.5rem;position:relative;overflow:hidden;box-shadow:0 0 1.4rem var(--glow)}
.card h2{font-size:.95rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.card .body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:.35rem}
.big{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.unknown{color:var(--mut)}
.ico{display:inline-block;width:1.2em;text-align:center;font-weight:700}
.lamp::before{content:"\25CF"}
.l-ok::before{content:"\2713"}.l-warn::before{content:"!"}.l-bad::before{content:"\2715"}.l-info::before{content:"i"}.l-unknown::before{content:"?"}
.row{display:flex;align-items:center;gap:.6rem;min-width:0}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:.3rem;min-height:0;overflow:hidden;flex:1}
.list>*{flex:0 0 auto}
.empty{color:var(--mut);display:flex;align-items:center;gap:.5rem;font-size:1.05rem}
svg{display:block}
.ring{position:relative;aspect-ratio:1;height:100%;max-height:100%;min-height:0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:9}
.ring .arc{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1),stroke .6s}
.ring .mid2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid2 b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .mid2 span{font-size:1rem;color:var(--mut)}
.scorebox{display:flex;align-items:center;gap:1rem;flex:1;min-height:0}
.letter{font-size:5rem;font-weight:800;line-height:1}
.fleet{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;flex:1;min-height:0}
.tile{border:1px solid var(--line);border-radius:.6rem;padding:.4rem .6rem;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.tile .big{font-size:2.6rem}
.tile .lab{font-size:.9rem;color:var(--mut);display:flex;gap:.4rem;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.t-ok .big{color:var(--ok)}.tile.t-bad .big{color:var(--bad)}.tile.t-warn .big{color:var(--warn)}.tile.t-info .big{color:var(--info)}
.flash-ok{animation:flashok 1.4s ease-out 1}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.chart .axis{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut)}
.legend{display:flex;gap:1rem;font-size:.85rem;color:var(--mut)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.35rem;vertical-align:-.1rem}
.area{vector-effect:non-scaling-stroke}
.heat{display:grid;gap:.18rem;flex:1;min-height:0;grid-auto-rows:1fr}
.heat .hr{display:grid;grid-template-columns:7.5rem repeat(24,1fr);gap:.14rem;align-items:stretch;min-height:0}
.heat .hn{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.heat .c{border-radius:.15rem;background:var(--line);opacity:.4}
.heat .c1{background:var(--ok);opacity:.85}.heat .c2{background:var(--warn);opacity:.9}.heat .c3{background:var(--bad);opacity:1}
.heat .hr.red .hn{color:var(--bad);font-weight:700}
.bar{height:.55rem;border-radius:.3rem;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar.ind i{width:35%;position:absolute}
.rowbar{display:flex;flex-direction:column;gap:.2rem;border-left:.25rem solid var(--cy);padding-left:.6rem}
.rowbar.stuck{border-color:var(--warn)}
.rowbar .top{display:flex;gap:.6rem;align-items:baseline;min-width:0}
.rowbar .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rowbar .v{color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.chip{display:inline-block;border:1px solid var(--line);border-radius:.4rem;padding:0 .4rem;font-size:.8rem;color:var(--mut);white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.failrow{display:flex;gap:.6rem;align-items:center;border:1px solid var(--bad);border-radius:.5rem;padding:.25rem .6rem;min-width:0;background:color-mix(in srgb,var(--bad) 9%,transparent)}
.failrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.failrow .v{color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.gauge{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.gauge svg{width:100%;height:100%;max-height:100%}
.gauge .mid2{position:absolute;left:0;right:0;bottom:8%;text-align:center}
.gauge .mid2 b{font-size:2.2rem;font-variant-numeric:tabular-nums}
.gauge .trk{fill:none;stroke:var(--line);stroke-width:8;stroke-linecap:round}
.gauge .arc{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1),stroke .6s}
.ticker{display:flex;flex-direction:column;gap:.18rem;overflow:hidden;flex:1;min-height:0}
.ticker .ev{display:flex;gap:.6rem;align-items:center;min-width:0;white-space:nowrap}
.ticker .ev .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ticker .ev .v{color:var(--mut);flex:0 0 auto;font-variant-numeric:tabular-nums}
.timeline{position:relative;flex:1;min-height:0}
.timeline .track{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.timeline .now{position:absolute;right:0;top:12%;bottom:12%;width:2px;background:var(--cy);box-shadow:0 0 .8rem var(--cy)}
.timeline .tick{position:absolute;top:50%;transform:translate(-50%,0);font-size:.8rem;color:var(--mut);padding-top:.5rem;white-space:nowrap}
.timeline .tick.last{transform:translate(-100%,0);padding-right:.5rem}
.timeline .pt{position:absolute;width:1.1rem;height:1.1rem;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg);transition:left 1s linear}
.timeline .pt.ok{background:var(--ok)}.timeline .pt.bad{background:var(--bad)}.timeline .pt.run{background:var(--cy)}.timeline .pt.wait{background:var(--warn)}.timeline .pt.skip{background:var(--mut)}
.sen-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:.7rem;min-height:0}
.sen{border:1px solid var(--line);border-radius:.7rem;padding:.5rem .7rem;display:flex;flex-direction:column;gap:.3rem;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--card),var(--card2))}
.sen .hd{display:flex;gap:.5rem;align-items:center;min-width:0}
.sen .hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}
.sen .num{font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sen .mini{height:2.6rem;width:2.6rem;position:relative;flex:0 0 auto}
.sen .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.sen .mini .trk{fill:none;stroke:var(--line);stroke-width:12}
.sen .mini .arc{fill:none;stroke:var(--cy);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.2s}
.sen.s-bad{border-color:var(--bad)}.sen.s-warn{border-color:var(--warn)}.sen.s-ok{border-color:var(--ok)}
.sen .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
.radar{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.radar svg{height:100%;max-width:100%;aspect-ratio:1}
.radar .rg{fill:none;stroke:var(--line);stroke-width:.4}
.radar .sweep{transform-origin:50px 50px}
.radar .blip{opacity:.9}
.bars{display:flex;flex-direction:column;gap:.45rem;flex:1;min-height:0;justify-content:center}
.bars .br{display:flex;align-items:center;gap:.6rem}
.bars .br .nm{flex:0 0 28%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.bars .br .bar{flex:1}
.bars .br .v{flex:0 0 2.6rem;text-align:right;font-variant-numeric:tabular-nums}
.bars .br.critical i,.bars .br.error i{background:var(--bad)}.bars .br.warning i{background:var(--warn)}.bars .br.info i{background:var(--info)}
.kiosk{position:fixed;left:50%;transform:translateX(-50%);bottom:.3rem;opacity:.25;background:none;border:1px solid var(--line);color:var(--mut);border-radius:.4rem;padding:.1rem .5rem;font-size:.8rem;cursor:pointer}
.kiosk:hover,.kiosk:focus{opacity:1}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:.8rem;flex:0 0 auto}
/* overview */
#s-overview{grid-template-columns:1.05fr 1.2fr 1.6fr 1.15fr;grid-template-rows:1.1fr 1.25fr .8fr;grid-template-areas:"score fleet trend trend" "heat heat top queue" "events events events api"}
#a-score{grid-area:score}#a-fleet{grid-area:fleet}#a-trend{grid-area:trend}#a-heat{grid-area:heat}#a-top{grid-area:top}#a-queue{grid-area:queue}#a-events{grid-area:events}#a-api{grid-area:api}
/* now */
#s-now{grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:1fr 1fr .62fr;grid-template-areas:"run queue fail" "run appr merge" "tl tl tl"}
#n-run{grid-area:run}#n-queue{grid-area:queue}#n-fail{grid-area:fail}#n-appr{grid-area:appr}#n-merge{grid-area:merge}#n-tl{grid-area:tl}
/* sentinels */
#s-sentinels{grid-template-columns:1fr 3.2fr;grid-template-rows:1fr;grid-template-areas:"side cards"}
#c-side{grid-area:side;display:grid;grid-template-rows:1.3fr 1fr;gap:.8rem;min-height:0}#c-cards{grid-area:cards}
@media (orientation:portrait){
#s-overview{grid-template-columns:1fr 1fr;grid-template-rows:.9fr .8fr .9fr 1fr .8fr .8fr;grid-template-areas:"score fleet" "trend trend" "heat heat" "top top" "queue api" "events events"}
#s-now{grid-template-columns:1fr 1fr;grid-template-rows:1.3fr .9fr .9fr .7fr .6fr;grid-template-areas:"run run" "queue appr" "fail fail" "merge merge" "tl tl"}
#s-sentinels{grid-template-columns:1fr;grid-template-rows:.55fr 1.7fr;grid-template-areas:"side" "cards"}
#c-side{grid-template-rows:none;grid-template-columns:1fr 1fr}
.sen-grid{grid-template-columns:repeat(3,1fr)}
.heat .hr{grid-template-columns:5.5rem repeat(24,1fr)}}
/* motion: nothing moves for who asked for less */
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(1.2rem) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
@keyframes failblink{0%,100%{box-shadow:0 0 .2rem var(--halo);border-color:var(--bad)}50%{box-shadow:0 0 1.6rem .3rem var(--halo);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}}
@keyframes failflash{0%{box-shadow:inset 0 0 7rem 1rem var(--halo)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes indet{from{left:0}to{left:65%}}
@keyframes flashok{0%{background:color-mix(in srgb,var(--ok) 60%,transparent)}100%{background:transparent}}
@keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ping{0%{opacity:1;r:3.2}18%{opacity:.35;r:2.2}100%{opacity:.35;r:2.2}}
@keyframes slide{0%{background-position:0 0}100%{background-position:3rem 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card,.sen{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.fail{animation:failblink 1.6s ease-in-out infinite}
.fail.calm{animation:none}
.fail-new{animation:failflash 1.2s ease-out 1}
.noblink .fail{animation:none}
.chart path.line{stroke-dasharray:var(--len,400);animation:draw 1.6s ease-out both}
.bar.ind i{animation:indet 1.8s ease-in-out infinite alternate}
.radar .sweep{animation:sweep 7s linear infinite}
.radar .blip.hot{animation:ping 7s linear infinite;animation-delay:calc(var(--a)/360*7s)}
.live-dot{animation:pulse 1.6s ease-in-out infinite}
}
.fail{border-color:var(--bad);box-shadow:0 0 1.1rem .1rem var(--halo)}
.fail.calm{box-shadow:0 0 .8rem 0 var(--halo)}
.noblink .fail{box-shadow:0 0 1.1rem .1rem var(--halo)}
.live-dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--cy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.radar .sweep{transform:rotate(40deg)}}
</style>
</head>
<body>
<div id="stage">
<header>
 <div class="brand"><span class="pulse" aria-hidden="true"></span><b id="h-title"></b><span class="tag" id="h-tag"></span></div>
 <div class="mid"><div class="dots" id="h-dots" aria-hidden="true"></div></div>
 <div class="clock" id="clock" aria-live="off"></div>
</header>
<div id="banner" role="status" hidden></div>

<main class="screen" id="s-shell" aria-labelledby="h-title"></main>
<div class="foot"><span id="f-left"></span><span id="f-right"></span></div>
</div>
<button type="button" class="kiosk" id="fs"></button>
<script>
"use strict";
const D=/*SCREEN_DATA*/null;
(function(){
const P=D.params,S=D.settings,KINDS=D.kinds,root=document.documentElement,body=document.body;
const T=(k,v)=>{let s=D.texts[k];if(s===undefined)s=k;if(v)for(const x in v)s=s.split("{"+x+"}").join(String(v[x]));return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const num=v=>typeof v==="number"&&isFinite(v)?v:0;
document.documentElement.lang=D.html_lang;
root.dataset.theme=P.theme;root.dataset.density=P.density;root.style.setProperty("--k",P.scale);
if(!P.blink)body.classList.add("noblink");
const RENDER={};
const STATE={kind:D.screen,data:null,fails:0,timer:0,tickAt:0,got:0,prevRed:new Set(),first:true,redSince:new Map(),lastSound:0};
/* ---------- formatting ---------- */
function dur(sec){
  if(sec==null||!isFinite(sec))return "–";
  sec=Math.max(0,Math.round(sec));
  const u=[["d",86400],["h",3600],["m",60],["s",1]];
  for(let i=0;i<u.length;i++){
    const [n,len]=u[i];
    if(sec<len&&i<u.length-1)continue;
    const q=Math.floor(sec/len),rest=sec-q*len;
    let out=q+" "+T("ui.scr_u_"+n);
    if(i<u.length-1&&rest>=u[i+1][1])out+=" "+Math.floor(rest/u[i+1][1])+" "+T("ui.scr_u_"+u[i+1][0]);
    return out;
  }
  return "0 "+T("ui.scr_u_s");
}
const ago=sec=>T("ui.scr_ago",{dur:dur(sec)});
const pct=(a,b)=>b>0?Math.max(0,Math.min(1,a/b)):0;
function tween(el,to,fmt){
  const from=el._v==null?0:el._v;el._v=to;fmt=fmt||(x=>String(Math.round(x)));
  if(reduce||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),span=650;
  cancelAnimationFrame(el._raf);
  const step=now=>{const k=Math.min(1,(now-t0)/span),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step);else el.textContent=fmt(to)};
  el._raf=requestAnimationFrame(step);
}
/* ---------- the common frame ---------- */
const titles={overview:"ui.scr_title_overview",now:"ui.scr_title_now",sentinels:"ui.scr_title_sentinels"};
function frame(){
  const k=STATE.kind;
  $("h-title").textContent=T(titles[k]);
  $("h-tag").textContent=T("ui.scr_monitor",{n:P.monitor});
  document.title=T(titles[k])+" - GitHub Actions Monitor";
  $("fs").textContent=T("ui.scr_fullscreen");
  $("h-dots").innerHTML=P.rotate>0?KINDS.map(x=>'<i class="'+(x===k?"on":"")+'"></i>').join(""):"";
  $("f-left").textContent="GitHub Actions Monitor "+T("ui.scr_version",{v:D.version});
}
function clock(){
  const d=new Date();
  $("clock").innerHTML=esc(d.toLocaleTimeString(D.locale,{hour:"2-digit",minute:"2-digit",second:"2-digit"}))+"<small>"+esc(d.toLocaleDateString(D.locale,{weekday:"long",day:"numeric",month:"long"}))+"</small>";
  nightDim(d);
}
function nightDim(d){
  if(!S.night_dim){body.classList.remove("dim");return}
  const h=d.getHours(),a=S.night_dim_from_hour,b=S.night_dim_to_hour;
  const inside=a===b?false:(a<b?(h>=a&&h<b):(h>=a||h<b));
  body.classList.toggle("dim",inside);
}
function burnIn(){
  if(!S.burn_in_protection)return;
  const r=()=>Math.round((Math.random()*2-1)*6);
  const move=()=>{$("stage").style.transform="translate("+r()+"px,"+r()+"px)"};
  move();setInterval(move,60000);
}
function banner(kind,text){
  const b=$("banner");
  if(!text){b.hidden=true;b.textContent="";body.classList.remove("offline");return}
  b.hidden=false;b.className=kind==="warn"?"warn":"";b.textContent=text;
  body.classList.toggle("offline",kind!=="warn");
}
function beep(){
  if(!P.sound)return;const now=Date.now();if(now-STATE.lastSound<30000)return;STATE.lastSound=now;
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},220)}catch(e){}
}
/* failures: a new one flashes once, an old one blinks until it is calm (screens.blink_calm_minutes) and then keeps a fixed halo */
function failMark(el,key,seconds){
  if(!el)return;
  el.classList.add("fail");
  const calm=S.blink_calm_minutes>0&&seconds!=null&&seconds>S.blink_calm_minutes*60;
  el.classList.toggle("calm",calm);
  el.setAttribute("data-fail",key);
}
function newFails(keys){
  const cur=new Set(keys);let isNew=false;
  if(!STATE.first)for(const k of cur)if(!STATE.prevRed.has(k))isNew=true;
  const fixed=!STATE.first&&[...STATE.prevRed].some(k=>!cur.has(k));
  STATE.prevRed=cur;STATE.first=false;
  return {isNew,fixed};
}
function flash(el,cls){if(!el||reduce)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
/* ---------- loop ---------- */
function show(kind){
  KINDS.forEach(k=>{const e=$("s-"+k);if(e)e.hidden=k!==kind});
  STATE.kind=kind;STATE.first=true;STATE.prevRed=new Set();body.className=body.className.replace(/\bk-\w+/g,"").trim()+" k-"+kind;
  frame();
}
function paint(d){
  const keys=(RENDER[STATE.kind]||(()=>[]))(d)||[];
  const r=newFails(keys);
  if(r.isNew){beep();$("stage").classList.remove("fail-new");void $("stage").offsetWidth;if(!reduce&&P.blink)flash($("stage"),"fail-new")}
  if(r.fixed)flash($("ft-green"),"flash-ok");
  const m=d.meta||{};
  if(!m.have_data)banner("warn",T("ui.scr_loading"));
  else if(m.age_seconds!=null&&m.age_seconds>3*num(m.refresh_seconds||60)+60)banner("warn",T("ui.scr_old",{age:dur(m.age_seconds)}));
  else if(m.paused)banner("warn",T("ui.scr_paused"));
  else banner(null);
  $("stage").style.opacity="";
}
async function load(){
  clearTimeout(STATE.timer);
  let wait=P.refresh*1000;
  try{
    const r=await fetch("/api/screens/data?screen="+encodeURIComponent(STATE.kind)+"&lang="+encodeURIComponent(D.lang),{cache:"no-store"});
    if(!r.ok)throw new Error(String(r.status));
    const d=await r.json();STATE.fails=0;STATE.data=d;STATE.got=Date.now();paint(d);
  }catch(e){
    STATE.fails++;const back=Math.min(60,5*Math.pow(2,STATE.fails-1));wait=back*1000;
    banner("bad",T("ui.scr_offline")+" · "+T("ui.scr_retry",{n:back}));
  }
  STATE.timer=setTimeout(load,wait);
}

$("fs").addEventListener("click",()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}});
show(STATE.kind);clock();setInterval(clock,1000);burnIn();load();
window.__screens={state:STATE,show:show,paint:paint};
})();
</script>
</body>
