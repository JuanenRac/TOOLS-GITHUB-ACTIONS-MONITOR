<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>GitHub Actions Monitor</title>
<style>
:root{--bg:#070d14;--bg2:#0c1622;--card:#101c2b;--card2:#0d1724;--line:#1d3047;--tx:#e6f1fb;--mut:#7f98b3;--cy:#22d3ee;--cy2:#0e7490;--ok:#34d399;--warn:#fbbf24;--bad:#fb4b4b;--info:#60a5fa;--glow:rgba(34,211,238,.18);--halo:rgba(251,75,75,.55)}
:root[data-theme=light]{--bg:#eef3f8;--bg2:#e3ebf3;--card:#ffffff;--card2:#f6f9fc;--line:#c9d6e3;--tx:#0b1b2b;--mut:#4d6580;--cy:#0891b2;--cy2:#155e75;--ok:#047857;--warn:#a16207;--bad:#c81e1e;--info:#1d4ed8;--glow:rgba(8,145,178,.14);--halo:rgba(200,30,30,.45)}
/* the sixteen themes of the main page (read from the page itself by the server) and the names the wall screens give to their colours */
/*THEME_CSS*/
:root[data-studio]{--bg2:var(--panel2);--card:var(--panel);--card2:var(--panel2);--tx:var(--text);--cy:var(--acc);--cy2:var(--acc2);--info:var(--run);--glow:color-mix(in srgb,var(--acc) 22%,transparent);--halo:color-mix(in srgb,var(--bad) 55%,transparent)}
:root[data-theme=contrast]{--bg:#000;--bg2:#000;--card:#000;--card2:#000;--line:#ffffff;--tx:#fff;--mut:#e0e0e0;--cy:#00e5ff;--cy2:#00e5ff;--ok:#00ff7f;--warn:#ffd700;--bad:#ff4040;--info:#7ab8ff;--glow:rgba(255,255,255,.12);--halo:rgba(255,64,64,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html{--k:1;--d:1;font-size:calc(var(--k)*var(--d)*min(100vw/120,100vh/67.5));background:var(--bg);color:var(--tx)}
html[data-density=compact]{--d:.9}
html[data-density=large]{--d:1.12}
@media (orientation:portrait){html{font-size:calc(var(--k)*var(--d)*min(100vw/62,100vh/108))}}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));height:100vh;overflow:hidden;font-size:1rem;line-height:1.25;transition:filter 2s,opacity .6s}
:lang(ja) body{font-family:system-ui,"Yu Gothic UI","Meiryo","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif}
:lang(zh) body{font-family:system-ui,"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif}
:root[data-studio] body{background:var(--page,var(--bg))}
body.dim{filter:brightness(.35)}
body.offline #stage{opacity:.5;filter:grayscale(.7)}
#wrap{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;transform:translate(calc(var(--sx,0)*.3rem),calc(var(--sy,0)*.3rem));display:flex;flex-direction:column;padding:1rem 1.2rem .8rem;gap:.7rem;transition:transform 30s linear,opacity .6s,filter .6s}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.brand b{font-size:1.5rem;letter-spacing:.02em;white-space:nowrap}
.brand .tag{font-size:.95rem;color:var(--mut);border:1px solid var(--line);border-radius:.4rem;padding:.1rem .5rem;white-space:nowrap}
.pulse{width:.8rem;height:.8rem;border-radius:50%;background:var(--cy);box-shadow:0 0 .9rem var(--cy);flex:0 0 auto}
.clock{font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:600;text-align:right;white-space:nowrap}
.clock small{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
.mid{flex:1;display:flex;justify-content:center;gap:.5rem;font-size:.9rem;color:var(--mut)}
.dots{display:flex;gap:.45rem;align-items:center}
.dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--cy)}
#banner{flex:0 0 auto;border:1px solid var(--bad);color:var(--bad);border-radius:.5rem;padding:.35rem .8rem;font-weight:600;font-size:1.05rem;background:color-mix(in srgb,var(--bad) 12%,transparent)}
#banner[hidden]{display:none}
#banner.warn{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.screen{flex:1 1 0;min-height:0;display:grid;gap:.8rem;transition:opacity .6s}
.screen[hidden]{display:none}
.screen.out{opacity:0}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1rem;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.5rem;position:relative;overflow:hidden;box-shadow:0 0 1.4rem var(--glow)}
.card h2{font-size:.95rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.card .body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:.35rem}
.big{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.unknown{color:var(--mut)}
.ico{display:inline-block;width:1.2em;text-align:center;font-weight:700}
.lamp::before{content:"\25CF"}
.l-ok::before{content:"\2713"}.l-warn::before{content:"!"}.l-bad::before{content:"\2715"}.l-info::before{content:"i"}.l-unknown::before{content:"?"}
.row{display:flex;align-items:center;gap:.6rem;min-width:0}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:.3rem;min-height:0;overflow:hidden;flex:1}
.list>*{flex:0 0 auto}
.empty{color:var(--mut);display:flex;align-items:center;gap:.5rem;font-size:1.05rem}
svg{display:block}
.ring{position:relative;aspect-ratio:1;height:100%;max-height:100%;min-height:0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:9}
.ring .arc{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1),stroke .6s}
.ring .mid2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid2 b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .mid2 span{font-size:1rem;color:var(--mut)}
.scorebox{display:flex;align-items:center;gap:1rem;flex:1;min-height:0}
.letter{font-size:5rem;font-weight:800;line-height:1}
.fleet{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;flex:1;min-height:0}
.tile{border:1px solid var(--line);border-radius:.6rem;padding:.4rem .6rem;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.tile .big{font-size:2.6rem}
.tile .lab{font-size:.9rem;color:var(--mut);display:flex;gap:.4rem;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.t-ok .big{color:var(--ok)}.tile.t-bad .big{color:var(--bad)}.tile.t-warn .big{color:var(--warn)}.tile.t-info .big{color:var(--info)}
.flash-ok{animation:flashok 1.4s ease-out 1}
.chart{flex:1;min-height:0;position:relative}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.chart .axis{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut)}
.legend{display:flex;gap:1rem;font-size:.85rem;color:var(--mut)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.35rem;vertical-align:-.1rem}
.area{vector-effect:non-scaling-stroke}
.heat{display:grid;gap:.18rem;flex:1;min-height:0;grid-auto-rows:1fr}
.heat .hr{display:grid;grid-template-columns:7.5rem repeat(24,1fr);gap:.14rem;align-items:stretch;min-height:0}
.heat .hn{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.heat .c{border-radius:.15rem;background:var(--line);opacity:.4}
.heat .c1{background:var(--ok);opacity:.85}.heat .c2{background:var(--warn);opacity:.9}.heat .c3{background:var(--bad);opacity:1}
.heat .hr.red .hn{color:var(--bad);font-weight:700}
.bar{height:.55rem;border-radius:.3rem;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar.ind i{width:35%;position:absolute}
.rowbar{display:flex;flex-direction:column;gap:.2rem;border-left:.25rem solid var(--cy);padding-left:.6rem}
.rowbar.stuck{border-color:var(--warn)}
.rowbar .top{display:flex;gap:.6rem;align-items:baseline;min-width:0}
.rowbar .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rowbar .v{color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.chip{display:inline-block;border:1px solid var(--line);border-radius:.4rem;padding:0 .4rem;font-size:.8rem;color:var(--mut);white-space:nowrap}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.failrow{display:flex;gap:.6rem;align-items:center;border:1px solid var(--bad);border-radius:.5rem;padding:.25rem .6rem;min-width:0;background:color-mix(in srgb,var(--bad) 9%,transparent)}
.failrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.failrow .v{color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.gauge{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.gauge svg{width:100%;height:100%;max-height:100%}
.gauge .mid2{position:absolute;left:0;right:0;bottom:8%;text-align:center}
.gauge .mid2 b{font-size:2.2rem;font-variant-numeric:tabular-nums}
.gauge .trk{fill:none;stroke:var(--line);stroke-width:8;stroke-linecap:round}
.gauge .arc{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1),stroke .6s}
.ticker{display:flex;flex-direction:column;gap:.18rem;overflow:hidden;flex:1;min-height:0}
.ticker .ev{display:flex;gap:.6rem;align-items:center;min-width:0;white-space:nowrap}
.ticker .ev .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ticker .ev .v{color:var(--mut);flex:0 0 auto;font-variant-numeric:tabular-nums}
.timeline{position:relative;flex:1;min-height:0}
.timeline .track{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.timeline .now{position:absolute;right:0;top:12%;bottom:12%;width:2px;background:var(--cy);box-shadow:0 0 .8rem var(--cy)}
.timeline .tick{position:absolute;top:50%;transform:translate(-50%,0);font-size:.8rem;color:var(--mut);padding-top:.5rem;white-space:nowrap}
.timeline .tick.last{transform:translate(-100%,0);padding-right:.5rem}
.timeline .pt{position:absolute;width:1.1rem;height:1.1rem;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg);transition:left 1s linear}
.timeline .pt.ok{background:var(--ok)}.timeline .pt.bad{background:var(--bad)}.timeline .pt.run{background:var(--cy)}.timeline .pt.wait{background:var(--warn)}.timeline .pt.skip{background:var(--mut)}
.sen-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:.7rem;min-height:0}
.sen{border:1px solid var(--line);border-radius:.7rem;padding:.5rem .7rem;display:flex;flex-direction:column;gap:.3rem;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--card),var(--card2))}
.sen .hd{display:flex;gap:.5rem;align-items:center;min-width:0}
.sen .hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem}
.sen .num{font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sen .mini{height:2.6rem;width:2.6rem;position:relative;flex:0 0 auto}
.sen .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.sen .mini .trk{fill:none;stroke:var(--line);stroke-width:12}
.sen .mini .arc{fill:none;stroke:var(--cy);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1.2s}
.sen.s-bad{border-color:var(--bad)}.sen.s-warn{border-color:var(--warn)}.sen.s-ok{border-color:var(--ok)}
.sen .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:auto}
.radar{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.radar svg{height:100%;max-width:100%;aspect-ratio:1}
.radar .rg{fill:none;stroke:var(--line);stroke-width:.4}
.radar .sweep{transform-origin:50px 50px}
.radar .blip{opacity:.9}
.bars{display:flex;flex-direction:column;gap:.45rem;flex:1;min-height:0;justify-content:center}
.bars .br{display:flex;align-items:center;gap:.6rem}
.bars .br .nm{flex:0 0 28%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.bars .br .bar{flex:1}
.bars .br .v{flex:0 0 2.6rem;text-align:right;font-variant-numeric:tabular-nums}
.bars .br.critical i,.bars .br.error i{background:var(--bad)}.bars .br.warning i{background:var(--warn)}.bars .br.info i{background:var(--info)}
.kiosk{position:fixed;left:50%;transform:translateX(-50%);bottom:.3rem;opacity:.25;background:none;border:1px solid var(--line);color:var(--mut);border-radius:.4rem;padding:.1rem .5rem;font-size:.8rem;cursor:pointer}
.kiosk:hover,.kiosk:focus{opacity:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--mut);font-size:.8rem;flex:0 0 auto}
/* the logo of the organization: a box of its own in the header or the footer, so it never covers the content; its largest size is in pixels at 1920 x 1080 and grows with the screen; the picture keeps its shape */
.orglogo{display:block;flex:0 0 auto;width:auto;height:auto;object-fit:contain;max-width:calc(var(--lw,160)*.0625rem);max-height:calc(var(--lh,64)*.0625rem)}
.orglogo[hidden]{display:none}
header>.orglogo:first-child{margin-right:1rem}header>.orglogo:last-child{margin-left:1rem}
/* overview */
#s-overview{grid-template-columns:1.05fr 1.2fr 1.6fr 1.15fr;grid-template-rows:1.1fr 1.25fr .8fr;grid-template-areas:"score fleet trend trend" "heat heat top queue" "events events events api"}
#a-score{grid-area:score}#a-fleet{grid-area:fleet}#a-trend{grid-area:trend}#a-heat{grid-area:heat}#a-top{grid-area:top}#a-queue{grid-area:queue}#a-events{grid-area:events}#a-api{grid-area:api}
/* now */
#s-now{grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:1fr 1fr .62fr;grid-template-areas:"run queue fail" "run appr merge" "tl tl tl"}
#n-run{grid-area:run}#n-queue{grid-area:queue}#n-fail{grid-area:fail}#n-appr{grid-area:appr}#n-merge{grid-area:merge}#n-tl{grid-area:tl}
/* sentinels */
#s-sentinels{grid-template-columns:1fr 3.2fr;grid-template-rows:1fr;grid-template-areas:"side cards"}
#c-side{grid-area:side;display:grid;grid-template-rows:1.3fr 1fr;gap:.8rem;min-height:0}#c-cards{grid-area:cards}
@media (orientation:portrait){
#s-overview{grid-template-columns:1fr 1fr;grid-template-rows:.9fr .8fr .9fr 1fr .8fr .8fr;grid-template-areas:"score fleet" "trend trend" "heat heat" "top top" "queue api" "events events"}
#s-now{grid-template-columns:1fr 1fr;grid-template-rows:1.3fr .9fr .9fr .7fr .6fr;grid-template-areas:"run run" "queue appr" "fail fail" "merge merge" "tl tl"}
#s-sentinels{grid-template-columns:1fr;grid-template-rows:.55fr 1.7fr;grid-template-areas:"side" "cards"}
#c-side{grid-template-rows:none;grid-template-columns:1fr 1fr}
.sen-grid{grid-template-columns:repeat(3,1fr)}
.heat .hr{grid-template-columns:5.5rem repeat(24,1fr)}}
/* motion: nothing moves for who asked for less */
@media (prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(1.2rem) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
@keyframes failblink{0%,100%{box-shadow:0 0 .2rem var(--halo);border-color:var(--bad)}50%{box-shadow:0 0 1.6rem .3rem var(--halo);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}}
@keyframes failflash{0%{box-shadow:inset 0 0 7rem 1rem var(--halo)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes indet{from{left:0}to{left:65%}}
@keyframes flashok{0%{background:color-mix(in srgb,var(--ok) 60%,transparent)}100%{background:transparent}}
@keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes ping{0%{opacity:1;r:3.2}18%{opacity:.35;r:2.2}100%{opacity:.35;r:2.2}}
@keyframes slide{0%{background-position:0 0}100%{background-position:3rem 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card,.sen{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.fail{animation:failblink 1.6s ease-in-out infinite}
.fail.calm{animation:none}
.fail-new{animation:failflash 1.2s ease-out 1}
.noblink .fail{animation:none}
.chart path.line{stroke-dasharray:var(--len,400);animation:draw 1.6s ease-out both}
.bar.ind i{animation:indet 1.8s ease-in-out infinite alternate}
.radar .sweep{animation:sweep 7s linear infinite}
.radar .blip.hot{animation:ping 7s linear infinite;animation-delay:calc(var(--a)/360*7s)}
.live-dot{animation:pulse 1.6s ease-in-out infinite}
}
.fail{border-color:var(--bad);box-shadow:0 0 1.1rem .1rem var(--halo)}
.fail.calm{box-shadow:0 0 .8rem 0 var(--halo)}
.noblink .fail{box-shadow:0 0 1.1rem .1rem var(--halo)}
.live-dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--cy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.radar .sweep{transform:rotate(40deg)}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<header>
 <img class="orglogo" id="lg-tl" alt="" hidden>
 <div class="brand"><span class="pulse" aria-hidden="true"></span><b id="h-title"></b><span class="tag" id="h-tag"></span></div>
 <div class="mid"><div class="dots" id="h-dots" aria-hidden="true"></div></div>
 <div class="clock" id="clock" aria-live="off"></div>
 <img class="orglogo" id="lg-tr" alt="" hidden>
</header>
<div id="banner" role="status" hidden></div>
<main class="screen" id="s-overview" aria-labelledby="h-title">
 <section class="card" id="a-score" style="--i:0"><h2 id="a-score-h"></h2><div class="body"><div class="scorebox"><div class="ring" id="r-score"></div><div><div class="letter" id="score-letter"></div><div class="mut" id="score-trend"></div></div></div></div></section>
 <section class="card" id="a-fleet" style="--i:1"><h2 id="a-fleet-h"></h2><div class="body"><div class="fleet" id="fleet"></div></div></section>
 <section class="card" id="a-trend" style="--i:2"><h2 id="a-trend-h"></h2><div class="body" style="display:grid;grid-template-columns:1.7fr 1fr;gap:.9rem"><div style="display:flex;flex-direction:column;min-height:0;gap:.3rem"><div class="legend" id="trend-leg"></div><div class="chart" id="ch24"></div></div><div style="display:flex;flex-direction:column;min-height:0;gap:.3rem"><div class="mut" id="ch7-h"></div><div class="chart" id="ch7"></div></div></div></section>
 <section class="card" id="a-heat" style="--i:3"><h2 id="a-heat-h"></h2><div class="body"><div class="heat" id="heat"></div></div></section>
 <section class="card" id="a-top" style="--i:4"><h2 id="a-top-h"></h2><div class="body"><div class="list" id="top-red"></div></div></section>
 <section class="card" id="a-queue" style="--i:5"><h2 id="a-queue-h"></h2><div class="body"><div class="list" id="queue"></div></div></section>
 <section class="card" id="a-events" style="--i:6"><h2 id="a-events-h"></h2><div class="body"><div class="ticker" id="events"></div></div></section>
 <section class="card" id="a-api" style="--i:7"><h2 id="a-api-h"></h2><div class="body"><div class="gauge" id="gauge"></div><div class="mut" id="api-note" style="text-align:center"></div></div></section>
</main>
<main class="screen" id="s-now" aria-labelledby="h-title" hidden>
 <section class="card" id="n-run" style="--i:0"><h2 id="n-run-h"></h2><div class="body"><div class="list" id="n-run-l"></div></div></section>
 <section class="card" id="n-queue" style="--i:1"><h2 id="n-queue-h"></h2><div class="body"><div class="list" id="n-queue-l"></div></div></section>
 <section class="card" id="n-fail" style="--i:2"><h2 id="n-fail-h"></h2><div class="body"><div class="list" id="n-fail-l"></div></div></section>

<script>
"use strict";
const D=/*SCREEN_DATA*/null;
/* the language of the screen: ?lang= of the address wins; else the one the person chose on the main page (the same key, `am-lang`, of the same browser store); else the one of the monitor, which is already
   embedded. A chosen language that is not the embedded one reloads the page ONCE with ?lang= (the other parameters stay, so ?rotate= keeps turning), before anything is drawn: there is no flash of the other language */
var LANG_RELOAD=false;
try{const q=new URLSearchParams(location.search);if(!q.has("lang")){const l=localStorage.getItem("am-lang");if(l&&/^[a-z]{2}$/.test(l)&&l!==D.lang){q.set("lang",l);LANG_RELOAD=true;location.replace(location.pathname+"?"+q.toString()+location.hash)}}}catch(e){}
(function(){
if(LANG_RELOAD)return;
const P=D.params,S=D.settings,KINDS=D.kinds,root=document.documentElement,body=document.body;
const T=(k,v)=>{let s=D.texts[k];if(s===undefined)s=k;if(v)for(const x in v)s=s.split("{"+x+"}").join(String(v[x]));return s};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const num=v=>typeof v==="number"&&isFinite(v)?v:0;
document.documentElement.lang=D.html_lang;
/* the theme: ?theme= for the whole window, else the one the settings give to each screen (its own, the one of all the screens, the one chosen for the whole product); `auto` follows the computer */
const THEME_OF=k=>P.theme_locked?P.theme:((D.themes||{})[k]||P.theme);
function applyTheme(name){
  let t=name||"dark";
  if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  root.dataset.theme=t;
  if(t==="light"||t==="dark"||t==="contrast")delete root.dataset.studio;else root.dataset.studio="1";
}
applyTheme(THEME_OF(D.screen));
root.dataset.density=P.density;root.style.setProperty("--k",P.scale);
/* the logo of the organization: one image, in the corner and on the screens the settings say */
const LG=D.logo,LG_IDS={"top-left":"lg-tl","top-right":"lg-tr","bottom-left":"lg-bl","bottom-right":"lg-br"};
function logoPaint(kind){
  document.querySelectorAll(".orglogo").forEach(e=>{e.hidden=true});
  if(!LG||!LG.show||!LG.show[kind])return;
  const img=$(LG_IDS[LG.corner]||"lg-tr");if(!img)return;
  if(!img.getAttribute("src")){img.addEventListener("error",()=>{img.hidden=true});img.setAttribute("src",LG.url)}
  img.style.setProperty("--lw",LG.max_width);img.style.setProperty("--lh",LG.max_height);img.hidden=false;
}
if(!P.blink)body.classList.add("noblink");
const RENDER={};
const STATE={kind:D.screen,data:null,fails:0,timer:0,tickAt:0,got:0,prevRed:new Set(),first:true,redSince:new Map(),lastSound:{},sq:[],sqAt:0,al:null,offSound:false};
/* ---------- formatting ---------- */
function dur(sec){
  if(sec==null||!isFinite(sec))return "–";
  sec=Math.max(0,Math.round(sec));
  const u=[["d",86400],["h",3600],["m",60],["s",1]];
  for(let i=0;i<u.length;i++){
    const [n,len]=u[i];
    if(sec<len&&i<u.length-1)continue;
    const q=Math.floor(sec/len),rest=sec-q*len;
    let out=q+" "+T("ui.scr_u_"+n);
    if(i<u.length-1&&rest>=u[i+1][1])out+=" "+Math.floor(rest/u[i+1][1])+" "+T("ui.scr_u_"+u[i+1][0]);
    return out;
  }
  return "0 "+T("ui.scr_u_s");
}
const ago=sec=>T("ui.scr_ago",{dur:dur(sec)});
const pct=(a,b)=>b>0?Math.max(0,Math.min(1,a/b)):0;
function tween(el,to,fmt){
  const from=el._v==null?0:el._v;el._v=to;fmt=fmt||(x=>String(Math.round(x)));
  if(reduce||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),span=650;
  cancelAnimationFrame(el._raf);
  const step=now=>{const k=Math.min(1,(now-t0)/span),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step);else el.textContent=fmt(to)};
  el._raf=requestAnimationFrame(step);
}
/* ---------- own charts: ring, gauge, area, bars, heat, radar (SVG, no library) ---------- */
const CIRC=2*Math.PI*42;
function ring(el,value,color,mid,sub){
  if(!el.firstChild){el.innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="42"/><circle class="arc" cx="50" cy="50" r="42" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+CIRC+'"/></svg><div class="mid2"><b></b><span></span></div>'}
  const arc=el.querySelector(".arc");arc.style.stroke=color;
  const set=()=>{arc.style.strokeDashoffset=String(CIRC*(1-(value==null?0:value)))};
  if(el._drawn)set();else{el._drawn=true;requestAnimationFrame(()=>requestAnimationFrame(set))}
  const b=el.querySelector("b");if(typeof mid==="number")tween(b,mid);else b.textContent=mid==null?"–":mid;
  el.querySelector("span").textContent=sub||"";
}
function areaSvg(series,keys,colors,w,h){
  /* stacked area of the keys (the first is at the bottom); viewBox is 0..w, 0..h and stretches to the box */
  const n=series.length;if(n<2)return "";
  const tot=series.map(p=>keys.reduce((a,k)=>a+num(p[k]),0)),max=Math.max(1,...tot);
  const x=i=>(i/(n-1)*w).toFixed(2),y=v=>(h-4-(v/max)*(h-10)).toFixed(2);
  let out='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="'+esc(T("ui.scr_chart_aria",{n:n}))+'">';
  for(let g=1;g<4;g++)out+='<line x1="0" x2="'+w+'" y1="'+(h*g/4).toFixed(1)+'" y2="'+(h*g/4).toFixed(1)+'" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  const base=series.map(()=>0);
  keys.forEach((k,ki)=>{
    const top=series.map((p,i)=>base[i]+num(p[k]));
    const up=top.map((v,i)=>x(i)+","+y(v)).join(" L"),dn=base.map((v,i)=>x(n-1-i)+","+y(base[n-1-i])).join(" L");
    out+='<path d="M'+up+" L"+dn+' Z" fill="'+colors[ki]+'" fill-opacity=".28" stroke="none"/>';
    if(ki===0)out+='<path class="line area" d="M'+up+'" fill="none" stroke="'+colors[ki]+'" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="--len:'+(w*4)+'"/>';
    top.forEach((v,i)=>{base[i]=v});
  });
  return out+"</svg>";
}
function gaugeSvg(el,frac,color,text,sub){
  if(!el.firstChild){el.innerHTML='<svg viewBox="0 0 100 58" aria-hidden="true"><path class="trk" d="M10 52 A40 40 0 0 1 90 52"/><path class="arc" d="M10 52 A40 40 0 0 1 90 52" stroke-dasharray="126" stroke-dashoffset="126"/></svg><div class="mid2"><b></b><div class="mut"></div></div>'}
  const arc=el.querySelector(".arc");arc.style.stroke=color;
  const set=()=>{arc.style.strokeDashoffset=String(126*(1-(frac==null?0:frac)))};
  if(el._drawn)set();else{el._drawn=true;requestAnimationFrame(()=>requestAnimationFrame(set))}
  const b=el.querySelector("b");if(typeof text==="number")tween(b,text,v=>Math.round(v).toLocaleString(D.locale));else b.textContent=text;
  el.querySelector(".mid2 .mut").textContent=sub||"";
}
function fit(list){
  /* a list shows only the rows that fit its box: nothing is cut in half and nothing scrolls */
  if(!list)return;[...list.children].forEach(c=>{c.hidden=false});
  let guard=list.children.length;
  while(guard-->0&&list.scrollHeight>list.clientHeight+1){let last=null;for(let i=list.children.length-1;i>=0;i--){if(!list.children[i].hidden){last=list.children[i];break}}if(!last)break;last.hidden=true}
}
const lampHtml=l=>'<span class="ico lamp l-'+esc(l)+' '+esc(l)+'" aria-hidden="true"></span>';
const levelWord=l=>T("ui.lv_"+l);
/* ---------- the common frame ---------- */
const titles={overview:"ui.scr_title_overview",now:"ui.scr_title_now",sentinels:"ui.scr_title_sentinels"};
function frame(){
  const k=STATE.kind;
  $("h-title").textContent=T(titles[k]);
  $("h-tag").textContent=T("ui.scr_monitor",{n:P.monitor});
  document.title=T(titles[k])+" - GitHub Actions Monitor";
  $("fs").textContent=T("ui.scr_fullscreen");
  $("h-dots").innerHTML=P.rotate>0?KINDS.map(x=>'<i class="'+(x===k?"on":"")+'"></i>').join(""):"";
  $("f-left").textContent="GitHub Actions Monitor "+T("ui.scr_version",{v:D.version});
}
function clock(){
  const d=new Date();
  $("clock").innerHTML=esc(d.toLocaleTimeString(D.locale,{hour:"2-digit",minute:"2-digit",second:"2-digit"}))+"<small>"+esc(d.toLocaleDateString(D.locale,{weekday:"long",day:"numeric",month:"long"}))+"</small>";
  nightDim(d);
}
function nightDim(d){
  if(!S.night_dim){body.classList.remove("dim");return}
  const h=d.getHours(),a=S.night_dim_from_hour,b=S.night_dim_to_hour;
  const inside=a===b?false:(a<b?(h>=a&&h<b):(h>=a||h<b));
  body.classList.toggle("dim",inside);
}
function burnIn(){
  if(!S.burn_in_protection)return;
  const r=()=>(Math.random()*2-1).toFixed(2);
  const move=()=>{$("stage").style.setProperty("--sx",r());$("stage").style.setProperty("--sy",r())};
  move();setInterval(move,60000);
}
function banner(kind,text){
  const b=$("banner");
  if(!text){b.hidden=true;b.textContent="";body.classList.remove("offline");return}
  b.hidden=false;b.className=kind==="warn"?"warn":"";b.textContent=text;
  body.classList.toggle("offline",kind!=="warn");
}
/*SOUNDS-BEGIN*/
/* the sounds of the monitor, one per kind of event, made with the Web Audio API (no audio file): the page and the wall screens carry this same block (a test keeps the two copies equal).
   A note is [Hz, start (s), length (s), Hz at the end (a slide)]. The themes change the colour (wave, attack, release, pitch), never the rhythm, so a kind is the same pattern in every theme. */
const SND_PATTERNS={
  red:{w:"sine",n:[[880,0,.15],[1175,.22,.15]]},
  sentinel:{w:"triangle",n:[[330,0,.14],[330,.2,.14],[330,.4,.14]]},
  stuck:{w:"sine",n:[[740,0,.7,370]]},
  score:{w:"triangle",n:[[784,0,.16],[622,.2,.16],[466,.4,.28]]},
  conn:{w:"sine",n:[[392,0,.3],[262,.38,.4]]},
  warning:{w:"triangle",n:[[660,0,.16],[660,.26,.16]]},
  resolved:{w:"sine",n:[[523,0,.12],[659,.14,.12],[784,.28,.25]]},
  report:{w:"triangle",n:[[1047,0,.12],[784,.16,.3]]},
  lesson:{w:"sine",n:[[1319,0,.08],[1568,.1,.08],[1976,.2,.16]]},
  info:{w:"sine",n:[[988,0,.22]]}
};
const SND_THEMES={classic:{w:"",atk:.02,rel:.15,mul:1,gain:1},soft:{w:"sine",atk:.06,rel:.35,mul:.75,gain:.8}};
let AUDIO=null;
function audioCtx(){try{if(!AUDIO){const C=window.AudioContext||window.webkitAudioContext;if(C)AUDIO=new C()}if(AUDIO&&AUDIO.state!=="running"&&AUDIO.state!=="closed")AUDIO.resume();return AUDIO}catch(e){return null}}
/* plays the patterns of the kinds one after the other (a string or a list); false when the browser does not let the page sound yet, so the caller can keep them and try again */
function playTones(vol,kinds,theme){const c=audioCtx();if(!c||c.state!=="running")return false;
  const list=Array.isArray(kinds)?kinds:[kinds||"red"],th=SND_THEMES[theme]||SND_THEMES.classic,v=Math.max(0.01,Math.min(1,vol||0.4))*0.5*th.gain;let t=c.currentTime+0.02;
  list.forEach(k=>{const p=SND_PATTERNS[k]||SND_PATTERNS.red;let end=0;
    p.n.forEach(([f,d,len,to])=>{const o=c.createOscillator(),g=c.createGain();o.type=th.w||p.w;o.frequency.setValueAtTime(f*th.mul,t+d);if(to)o.frequency.linearRampToValueAtTime(to*th.mul,t+d+len);o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(v,t+d+th.atk);g.gain.exponentialRampToValueAtTime(0.0001,t+d+len+th.rel);o.start(t+d);o.stop(t+d+len+th.rel+0.02);end=Math.max(end,d+len+th.rel)});
    t+=end+0.25});
  return true}
/*SOUNDS-END*/
/* the sounds of the wall are the ones of the page (the block above is the same text): one per kind of event, with the volume, the theme, the switches and the quiet hours of the settings, and only in a window that asks for them (?sound=on) in a monitor that allows them (screens.sound) */
const SC=Object.assign({enabled:true,theme:"classic",volume:40,cooldown_seconds:30,quiet_enabled:false,quiet_from_hour:22,quiet_to_hour:7},D.sound||{});
const SND_SW={red:"new_red",conn:"connection_lost",score:"score_drop"};
function sndQuiet(){if(!SC.quiet_enabled||SC.quiet_from_hour===SC.quiet_to_hour)return false;const h=new Date().getHours(),a=SC.quiet_from_hour,b=SC.quiet_to_hour;return a<b?(h>=a&&h<b):(h>=a||h<b)}
function beep(kinds){
  if(!P.sound||SC.enabled===false)return;const now=Date.now();
  for(const k of kinds||["red"]){if(SC["on_"+(SND_SW[k]||k)]===false||!SND_PATTERNS[k])continue;if(STATE.lastSound[k]&&now-STATE.lastSound[k]<SC.cooldown_seconds*1000)continue;if(!STATE.sq.includes(k))STATE.sq.push(k)}
  sndDrain();
}
/* what waits (the browser may not allow sound yet) plays at the next try: a gesture, or the pump every three seconds; at most three patterns in a burst */
function sndDrain(){
  if(!STATE.sq.length||sndQuiet())return;const now=Date.now();if(now<STATE.sqAt)return;
  const batch=STATE.sq.slice(0,3);if(playTones(SC.volume/100,batch,SC.theme)===false)return;
  STATE.sqAt=now+1500+(batch.length-1)*1200;batch.forEach(k=>{STATE.lastSound[k]=now});STATE.sq=STATE.sq.slice(batch.length);
}
["pointerup","click","touchend","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(P.sound){audioCtx();sndDrain()}},{capture:true}));
setInterval(()=>{if(P.sound&&STATE.sq.length)sndDrain()},3000);
/* alerts of the sentinels that rise between two looks sound as their level (a serious one, a warning); the first look only remembers */
function alertSound(al){
  if(!al||typeof al.by_level!=="object")return;const bl=al.by_level,sv=num(bl.critical)+num(bl.error),wn=num(bl.warning);
  if(STATE.al){const k=[];if(sv>STATE.al.sv)k.push("sentinel");if(wn>STATE.al.wn)k.push("warning");if(k.length)beep(k)}
  STATE.al={sv:sv,wn:wn};
}
/* failures: a new one flashes once, an old one blinks until it is calm (screens.blink_calm_minutes) and then keeps a fixed halo */
function failMark(el,key,seconds){
  if(!el)return;
  el.classList.add("fail");
  const calm=S.blink_calm_minutes>0&&seconds!=null&&seconds>S.blink_calm_minutes*60;
  el.classList.toggle("calm",calm);
  el.setAttribute("data-fail",key);
}
function newFails(keys){
  const cur=new Set(keys);let isNew=false;
  if(!STATE.first)for(const k of cur)if(!STATE.prevRed.has(k))isNew=true;
  const fixed=!STATE.first&&[...STATE.prevRed].some(k=>!cur.has(k));
  STATE.prevRed=cur;STATE.first=false;
  return {isNew,fixed};
}
function flash(el,cls){if(!el||reduce)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
/* ---------- overview ---------- */
function renderOverview(d){
  $("a-score-h").textContent=T("ui.scr_score");$("a-fleet-h").textContent=T("ui.scr_fleet");$("a-trend-h").textContent=T("ui.scr_trend");$("a-heat-h").textContent=T("ui.scr_heat");
  $("a-top-h").textContent=T("ui.scr_top_red");$("a-queue-h").textContent=T("ui.scr_queue");$("a-events-h").textContent=T("ui.scr_events");$("a-api-h").textContent=T("ui.scr_api");
  const sc=d.score||{},f=d.fleet||{};
  const has=sc.state==="scored"&&sc.value!=null;
  const col=!has?"var(--mut)":sc.value>=80?"var(--ok)":sc.value>=60?"var(--warn)":"var(--bad)";
  ring($("r-score"),has?sc.value/100:0,col,has?Math.round(sc.value):"–",has?"/ 100":T(sc.state==="off"?"ui.scr_score_off":"ui.scr_score_calibrating"));
  $("score-letter").textContent=has&&sc.letter?sc.letter:"";$("score-letter").style.color=col;
  $("score-trend").textContent=has&&sc.trend!=null?(sc.trend>0?"▲ +":sc.trend<0?"▼ ":"= ")+sc.trend:"";
  /* fleet */
  const tiles=[["green","t-ok",f.green],["red","t-bad",f.red],["stuck","t-warn",f.stuck],["waiting","t-info",f.waiting]];
  const fl=$("fleet");
  if(!fl.firstChild){fl.innerHTML=tiles.map(([k,c])=>'<div class="tile '+c+'" id="ft-'+k+'"><div class="big"></div><div class="lab"><span class="ico lamp l-'+(k==="green"?"ok":k==="red"?"bad":k==="stuck"?"warn":"info")+'" aria-hidden="true"></span><span></span></div></div>').join("")}
  tiles.forEach(([k,c,v])=>{const t=$("ft-"+k);tween(t.querySelector(".big"),num(v));t.querySelector(".lab span:last-child").textContent=T("ui.scr_"+k)+(k==="green"?" · "+T("ui.scr_of",{n:num(f.total)}):"");});
  const redTile=$("ft-red");if(num(f.red)>0)failMark(redTile,"fleet-red",null);else{redTile.classList.remove("fail","calm")}
  /* trend */
  const lg=$("trend-leg");lg.innerHTML='<span><i style="background:var(--ok)"></i>'+esc(T("ui.scr_runs_ok"))+'</span><span><i style="background:var(--bad)"></i>'+esc(T("ui.scr_runs_bad"))+"</span><span>"+esc(T("ui.scr_h24"))+"</span>";
  const a24=areaSvg(d.trend24||[],["ok","bad"],["var(--ok)","var(--bad)"],240,80);
  $("ch24").innerHTML=a24+'<div class="axis"><span>'+esc(T("ui.scr_ago",{dur:"24 "+T("ui.scr_u_h")}))+"</span><span>"+esc(T("ui.scr_now"))+"</span></div>";
  $("ch7-h").textContent=T("ui.scr_d7");
  $("ch7").innerHTML=areaSvg(d.trend7d||[],["ok","bad"],["var(--ok)","var(--bad)"],120,80)+'<div class="axis"><span>'+esc(T("ui.scr_ago",{dur:"7 "+T("ui.scr_u_d")}))+"</span><span>"+esc(T("ui.scr_now"))+"</span></div>";
  /* heat */
  const heat=$("heat");
  heat.innerHTML=(d.heat||[]).map(r=>'<div class="hr'+(r.red?" red":"")+'"><div class="hn" title="'+esc(r.repo)+'">'+(r.red?'<span class="ico lamp l-bad" aria-hidden="true"></span>':"")+esc(r.repo)+"</div>"+r.cells.map(c=>'<div class="c c'+c+'"></div>').join("")+"</div>").join("")||'<div class="empty">'+esc(T("ui.scr_none"))+"</div>";
  /* top red */
  const tr=$("top-red"),top=d.top_red||[];
  tr.innerHTML=top.length?top.map((r,i)=>'<div class="failrow" id="tr-'+i+'"><span class="ico lamp l-bad bad" aria-hidden="true"></span><span class="nm" title="'+esc(r.repo+" "+r.workflow)+'"><b>'+esc(r.repo)+"</b> "+esc(r.workflow)+'</span><span class="v">'+esc(r.seconds==null?"–":dur(r.seconds))+"</span></div>").join(""):'<div class="empty"><span class="ico lamp l-ok ok" aria-hidden="true"></span>'+esc(T("ui.scr_nothing_red"))+"</div>";
  top.forEach((r,i)=>failMark($("tr-"+i),"top:"+r.repo+":"+r.workflow,r.seconds));
  fit(tr);
  /* queue */
  const q=d.queue||{};
  $("queue").innerHTML=[["ui.scr_running",q.running,"info"],["ui.scr_queued",q.queued,"warn"],["ui.scr_approval",q.approval,"warn"],["ui.scr_min24",q.minutes24,"ok"],["ui.scr_min7",q.minutes7d,"mut"]].map(([k,v,c])=>'<div class="row"><span class="nm">'+esc(T(k))+'</span><b class="'+c+'" style="font-size:1.6rem;font-variant-numeric:tabular-nums">'+esc(num(v).toLocaleString(D.locale))+"</b></div>").join("");
  fit($("queue"));
  /* events */
  const ev=d.events||[];
  $("events").innerHTML=ev.length?ev.map(e=>'<div class="ev">'+lampHtml(e.kind==="ok"?"ok":e.kind==="bad"?"bad":e.kind==="skip"?"unknown":"info")+'<span class="nm" title="'+esc(e.repo+" "+e.workflow)+'"><b>'+esc(e.repo)+"</b> "+esc(e.workflow)+'</span><span class="'+(e.kind==="bad"?"bad":"mut")+'">'+esc(T("ui.scr_ev_"+e.kind))+'</span><span class="v">'+esc(ago(e.ago))+"</span></div>").join(""):'<div class="empty">'+esc(T("ui.scr_none"))+"</div>";
  fit($("events"));
  /* api */
  const api=(d.meta||{}).api||{};
  const frac=api.limit>0&&api.remaining!=null?api.remaining/api.limit:null;
  gaugeSvg($("gauge"),frac,api.low?"var(--bad)":frac!=null&&frac<.3?"var(--warn)":"var(--cy)",api.remaining==null?"–":num(api.remaining),api.limit?"/ "+num(api.limit).toLocaleString(D.locale):"");
  $("api-note").textContent=api.reset_seconds!=null?T("ui.scr_api_reset",{dur:dur(api.reset_seconds)}):"";
  const al=d.alerts||{};
  $("f-right").textContent=T("ui.scr_alerts_open",{n:num(al.total)});
  return [...(top.map(r=>"top:"+r.repo+":"+r.workflow)),...(num(f.red)>0?["fleet-red"]:[])];
}
/* ---------- now ---------- */
function runRow(r){
  const prog=r.progress!=null?'<div class="bar"><i style="width:0" data-w="'+Math.round(r.progress*100)+'"></i></div>':'<div class="bar ind"><i></i></div>';
  return '<div class="rowbar'+(r.stuck?" stuck":"")+'"><div class="top"><span class="nm" title="'+esc(r.repo+" "+r.workflow)+'">'+esc(r.repo)+" "+'<span class="mut" style="font-weight:400">'+esc(r.workflow)+'</span></span>'+(r.stuck?'<span class="chip warn">'+esc(T("ui.scr_stuck_tag"))+"</span>":"")+(r.event?'<span class="chip">'+esc(r.event)+"</span>":"")+'<span class="v">'+esc(dur(r.seconds))+(r.progress!=null?" · "+Math.round(r.progress*100)+" %":"")+"</span></div>"+prog+"</div>";
}
function setBars(root){requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll(".bar i[data-w]").forEach(i=>{i.style.width=i.dataset.w+"%"})))}
function listOrEmpty(el,rows,html,emptyKey){el.innerHTML=rows.length?rows.map(html).join(""):'<div class="empty">'+esc(T(emptyKey))+"</div>";fit(el)}
function renderNow(d){
  const t=d.totals||{};
  $("n-run-h").textContent=T("ui.scr_now_running")+" · "+num(t.running);$("n-queue-h").textContent=T("ui.scr_now_queue")+" · "+num(t.queued);$("n-fail-h").textContent=T("ui.scr_now_failures")+" · "+num(t.failures);
  $("n-appr-h").textContent=T("ui.scr_now_approval")+" · "+num(t.approval);$("n-merge-h").textContent=T("ui.scr_now_merges");$("n-tl-h").textContent=T("ui.scr_now_timeline");
  const run=$("n-run-l");listOrEmpty(run,d.running||[],runRow,"ui.scr_idle_now");setBars(run);
  listOrEmpty($("n-queue-l"),d.queued||[],r=>'<div class="row">'+lampHtml("warn")+'<span class="nm" title="'+esc(r.repo+" "+r.workflow)+'"><b>'+esc(r.repo)+"</b> "+esc(r.workflow)+'</span><span class="v">'+esc(dur(r.seconds))+"</span></div>","ui.scr_none");
  listOrEmpty($("n-appr-l"),d.approval||[],r=>'<div class="row">'+lampHtml("warn")+'<span class="nm"><b>'+esc(r.repo)+'</b></span><span class="v">'+esc(r.ago==null?"":ago(r.ago))+"</span></div>","ui.scr_none");
  const fl=d.failures||[];
  listOrEmpty($("n-fail-l"),fl,(r,i)=>'<div class="failrow" id="nf-'+i+'"><span class="ico lamp l-bad bad" aria-hidden="true"></span><span class="nm" title="'+esc(r.repo+" "+r.workflow)+'"><b>'+esc(r.repo)+"</b> "+esc(r.workflow)+(r.attempt>1?' <span class="chip">'+esc(T("ui.scr_attempt",{n:r.attempt}))+"</span>":"")+'</span><span class="v">'+esc(ago(r.ago))+"</span></div>","ui.scr_nothing_red");
  fl.forEach((r,i)=>failMark($("nf-"+i),"fail:"+r.repo+":"+r.workflow+":"+Math.floor(r.ago/60),r.ago));
  /* merges, releases and what comes next */
  const mg=d.merges||[],nx=d.next_releases||[],pd=d.pending_sign||[];
  const rows=[...mg.map(m=>'<div class="row">'+lampHtml("ok")+'<span class="nm"><b>'+esc(m.repo)+'</b></span><span class="chip'+(m.release?" ok":"")+'">'+esc(T(m.release?"ui.scr_release":"ui.scr_merge"))+'</span><span class="v">'+esc(m.ago==null?"":ago(m.ago))+"</span></div>"),
    ...nx.map(m=>'<div class="row">'+lampHtml("info")+'<span class="nm"><b>'+esc(m.repo)+'</b> <span class="mut">'+esc(T("ui.scr_next"))+'</span></span><span class="v">'+esc(T("ui.scr_entries",{n:m.entries}))+"</span></div>"),
    ...pd.map(m=>'<div class="row">'+lampHtml("warn")+'<span class="nm"><b>'+esc(m.repo)+'</b> <span class="mut">'+esc(T("ui.scr_sign"))+'</span></span><span class="v">'+esc(dur(m.hours*3600))+"</span></div>")];
  const ml=$("n-merge-l");ml.innerHTML=rows.length?rows.join(""):'<div class="empty">'+esc(T("ui.scr_none"))+"</div>";fit(ml);
  drawTimeline(d.timeline||[]);
  $("f-right").textContent="";
  return fl.map(r=>"fail:"+r.repo+":"+r.workflow+":"+Math.floor(r.ago/60));
}
const WINDOW=7200;
function drawTimeline(items){
  const tl=$("timeline");
  let html='<div class="track"></div><div class="now"></div>';
  [0,1800,3600,5400,7200].forEach(s=>{html+='<div class="tick'+(s===0?" last":"")+'" style="left:'+((1-s/WINDOW)*100)+'%">'+esc(s===0?T("ui.scr_now"):dur(s))+"</div>"});
  const lane=[0,0,0];
  items.forEach((e,i)=>{if(e.ago>WINDOW)return;html+='<div class="pt '+esc(e.kind)+'" data-ago="'+e.ago+'" style="left:'+((1-e.ago/WINDOW)*100)+'%;top:'+(18+((i%3)*10))+'%" title="'+esc(e.repo+" "+e.workflow+" "+T("ui.scr_ev_"+e.kind))+'"></div>'});
  tl.innerHTML=html;STATE.tlAt=Date.now();
}
function slideTimeline(){
  const el=$("timeline");if(!el||STATE.kind!=="now")return;
  const dt=(Date.now()-(STATE.tlAt||Date.now()))/1000;
  el.querySelectorAll(".pt").forEach(p=>{const a=num(+p.dataset.ago)+dt;p.style.left=((1-a/WINDOW)*100)+"%";p.hidden=a>WINDOW});
}
/* ---------- sentinels ---------- */
const BLIPS=12;
function radar(cards,sweepFx){
  const rg=[16,28,40].map(r=>'<circle class="rg" cx="50" cy="50" r="'+r+'"/>').join("")+'<line class="rg" x1="50" x2="50" y1="6" y2="94"/><line class="rg" x1="6" x2="94" y1="50" y2="50"/>';
  const wedge='<defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--cy)" stop-opacity="0"/><stop offset="1" stop-color="var(--cy)" stop-opacity=".55"/></linearGradient></defs><g class="sweep"><path d="M50 50 L50 6 A44 44 0 0 1 81 19 Z" fill="url(#swg)" transform="rotate(-48 50 50)"/><line x1="50" y1="50" x2="50" y2="6" stroke="var(--cy)" stroke-width=".8" transform="rotate(-3 50 50)"/></g>';
  let blips="";
  cards.forEach((c,i)=>{if(c.level!=="bad"&&c.level!=="warn")return;const ang=(i/BLIPS)*360,rad=c.level==="bad"?16+((i*7)%12):28+((i*5)%12),x=50+Math.sin(ang*Math.PI/180)*rad,y=50-Math.cos(ang*Math.PI/180)*rad;blips+='<circle class="blip hot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="'+(c.level==="bad"?"var(--bad)":"var(--warn)")+'" style="--a:'+ang.toFixed(0)+'"/>'});
  return '<svg viewBox="0 0 100 100" role="img" aria-label="'+esc(T("ui.scr_sen_radar"))+'">'+rg+wedge+blips+"</svg>";
}
function renderSentinels(d){
  $("c-radar-h").textContent=T("ui.scr_sen_radar");$("c-alerts-h").textContent=T("ui.scr_sen_alerts");
  const host=$("c-cards");
  if(!d.enabled){host.innerHTML='<div class="card" style="grid-column:1/-1"><div class="empty">'+esc(T(d.meta&&d.meta.edition==="lite"?"ui.scr_sen_lite":"ui.scr_sen_off"))+"</div></div>";$("radar").innerHTML=radar([]);$("c-bars").innerHTML="";return []}
  const sw=d.sweep||{},prog=d.loading?0.07:(sw.progress==null?0:sw.progress);
  const cards=d.cards||[];
  host.innerHTML=cards.map((c,i)=>{
    const nm=T("ui."+c.id),dash=2*Math.PI*45;
    return '<section class="sen s-'+esc(c.level)+'" id="sc-'+esc(c.id)+'" style="--i:'+(i+2)+'" aria-label="'+esc(nm)+'"><div class="hd">'+lampHtml(c.level)+'<b title="'+esc(nm)+'">'+esc(nm)+'</b><span class="mini" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle class="arc" cx="50" cy="50" r="45" stroke-dasharray="'+dash.toFixed(1)+'" stroke-dashoffset="'+(dash*(1-prog)).toFixed(1)+'"/></svg></span></div>'+
      '<div class="num '+esc(c.level)+'">'+(c.open==null?"–":esc(num(c.open)))+'</div><div class="mut">'+esc(c.open==null?levelWord(c.level):T("ui.scr_sen_open",{n:c.open}))+'</div><div class="mut" style="font-size:.9rem">'+esc(sw.age_seconds==null?"":T("ui.scr_sen_swept",{ago:ago(sw.age_seconds)}))+'</div><div class="meta"><span class="chip '+(c.readable?"ok":"warn")+'">'+esc(T(c.readable?"ui.scr_sen_readable":"ui.scr_sen_unreadable"))+'</span><span class="chip '+esc(c.level)+'">'+esc(levelWord(c.level))+"</span></div></section>";
  }).join("");
  cards.forEach(c=>{if(c.level==="bad")failMark($("sc-"+c.id),"sen:"+c.id,null)});
  $("radar").innerHTML=radar(cards);
  const al=(d.alerts||{}),bl=al.by_level||{},mx=Math.max(1,...["critical","error","warning","info"].map(k=>num(bl[k])));
  $("c-bars").innerHTML=["critical","error","warning","info"].map(k=>'<div class="br '+k+'"><span class="nm">'+esc(T("ui.scr_sev_"+k))+'</span><div class="bar"><i style="width:'+Math.round(num(bl[k])/mx*100)+'%"></i></div><span class="v">'+num(bl[k])+"</span></div>").join("");
  $("f-right").textContent=sw.age_seconds==null?"":T("ui.scr_sen_swept",{ago:ago(sw.age_seconds)});
  return cards.filter(c=>c.level==="bad").map(c=>"sen:"+c.id);
}
RENDER.overview=renderOverview;RENDER.now=renderNow;RENDER.sentinels=renderSentinels;
/* ---------- loop ---------- */
function show(kind){
  KINDS.forEach(k=>{const e=$("s-"+k);if(e)e.hidden=k!==kind});
  STATE.kind=kind;STATE.first=true;STATE.prevRed=new Set();body.className=body.className.replace(/\bk-\w+/g,"").trim()+" k-"+kind;
  applyTheme(THEME_OF(kind));logoPaint(kind);
  frame();
}
function paint(d){
  const keys=(RENDER[STATE.kind]||(()=>[]))(d)||[];
  observe(STATE.kind,d);
  const r=newFails(keys);
  if(r.isNew){beep(["red"]);$("stage").classList.remove("fail-new");void $("stage").offsetWidth;if(!reduce&&P.blink)flash($("stage"),"fail-new")}
  if(r.fixed){flash($("ft-green"),"flash-ok");beep(["resolved"])}
  alertSound(d.alerts);
  const m=d.meta||{};
  if(!m.have_data)banner("warn",T("ui.scr_loading"));
  else if(m.age_seconds!=null&&m.age_seconds>3*num(m.refresh_seconds||60)+60)banner("warn",T("ui.scr_old",{age:dur(m.age_seconds)}));
  else if(m.paused)banner("warn",T("ui.scr_paused"));
  else banner(null);
  $("stage").style.opacity="";
  setTimeout(()=>document.querySelectorAll(".list,.ticker").forEach(fit),400);      /* the type may arrive after the first layout: fit the rows again */
}
async function load(){
  clearTimeout(STATE.timer);
  let wait=P.refresh*1000;
  try{
    const r=await getData(STATE.kind);
    if(!r.ok)throw new Error(String(r.status));
    const d=await r.json();STATE.fails=0;STATE.offSound=false;STATE.data=d;STATE.got=Date.now();paint(d);
    if(P.jump)JUMP_KINDS.forEach(k=>{if(k!==STATE.kind)peek(k)});
  }catch(e){
    STATE.fails++;if(!STATE.offSound){STATE.offSound=true;beep(["conn"])}const back=Math.min(60,5*Math.pow(2,STATE.fails-1));wait=back*1000;
    banner("bad",T("ui.scr_offline")+" · "+T("ui.scr_retry",{n:back}));
  }
  STATE.timer=setTimeout(load,wait);
}
/* ---------- turning and jumping ----------
   With screens.mode = rotate this one window turns through the screens every `rotate` seconds. A red that was not there before makes it jump to the screen that shows it ('now' for the workflows that failed,
   'sentinels' for the panels in red) and stay there `hold` seconds, or until that red is gone if that comes first, and then it goes on turning. A red that was already shown does not make it jump again until it
   changes or comes back. The first data of a screen is the starting point: what is red when the window opens does not make it jump. */
const JUMP_KINDS=["now","sentinels"];
const R={timer:0,holdTimer:0,hold:null,pending:[],shown:{now:new Set(),sentinels:new Set()},seen:{},cur:{now:new Set(),sentinels:new Set()}};
const nextKind=()=>KINDS[(KINDS.indexOf(STATE.kind)+1)%KINDS.length];
function goTo(next){
  if(STATE.moving){setTimeout(()=>goTo(next),600);return}
  if(next===STATE.kind)return;
  const cur=$("s-"+STATE.kind);STATE.moving=true;
  if(history.replaceState)try{history.replaceState(null,"","/screen/"+next+location.search)}catch(e){}
  const go=()=>{show(next);load();$("s-"+next).classList.remove("out");STATE.moving=false};
  if(reduce){go()}else{cur.classList.add("out");setTimeout(go,500)}
}
function schedule(){
  clearTimeout(R.timer);
  if(P.rotate<=0)return;
  R.timer=setTimeout(()=>{if(!R.hold)goTo(nextKind());schedule()},P.rotate*1000);
}
function redKeys(kind,d){
  if(kind==="now")return (d.failures||[]).map(r=>"f:"+r.repo+":"+r.workflow);
  if(kind==="sentinels"&&d.enabled)return (d.cards||[]).filter(c=>c.level==="bad").map(c=>"s:"+c.id);
  return [];
}
function startHold(kind,keys){
  R.hold={kind:kind,keys:new Set(keys)};clearTimeout(R.holdTimer);clearTimeout(R.timer);
  goTo(kind);
  R.holdTimer=setTimeout(endHold,P.hold*1000);
}
function endHold(){
  clearTimeout(R.holdTimer);R.hold=null;
  while(R.pending.length){const p=R.pending.shift();if([...p.keys].some(k=>R.cur[p.kind].has(k))){startHold(p.kind,p.keys);return}}
  schedule();
}
function jump(kind,keys){
  if(!R.hold){startHold(kind,keys);return}
  if(R.hold.kind===kind){keys.forEach(k=>R.hold.keys.add(k));clearTimeout(R.holdTimer);R.holdTimer=setTimeout(endHold,P.hold*1000)}
  else R.pending.push({kind:kind,keys:new Set(keys)});
}
function observe(kind,d){
  if(!P.jump||JUMP_KINDS.indexOf(kind)<0)return;
  const cur=new Set(redKeys(kind,d)),shown=R.shown[kind];
  R.cur[kind]=cur;
  shown.forEach(k=>{if(!cur.has(k))shown.delete(k)});
  const fresh=[...cur].filter(k=>!shown.has(k));
  if(!R.seen[kind]){R.seen[kind]=true;cur.forEach(k=>shown.add(k));return}
  if(fresh.length){fresh.forEach(k=>shown.add(k));jump(kind,fresh)}
  if(R.hold&&R.hold.kind===kind&&![...R.hold.keys].some(k=>cur.has(k)))endHold();
}
function getData(kind){return fetch("/api/screens/data?screen="+encodeURIComponent(kind)+"&lang="+encodeURIComponent(D.lang),{cache:"no-store"})}
async function peek(kind){
  try{const r=await getData(kind);if(r.ok)observe(kind,await r.json())}catch(e){}
}
$("fs").addEventListener("click",()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}});
show(STATE.kind);clock();setInterval(clock,1000);setInterval(slideTimeline,1000);burnIn();schedule();load();
window.__screens={state:STATE,show:show,paint:paint,observe:observe,turn:R,params:P,theme:applyTheme,schedule:schedule};
})();
</script>
