*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,"Segoe UI","Hiragino Sans","Yu Gothic","Microsoft YaHei","PingFang SC",sans-serif;display:flex;flex-direction:column;overflow:hidden;background-image:linear-gradient(45deg,var(--tex) 25%,transparent 25%,transparent 50%,var(--tex) 50%,var(--tex) 75%,transparent 75%,transparent),radial-gradient(circle at center,var(--panel) 0%,var(--bg) 100%);background-size:4px 4px,100% 100%}
header{display:flex;flex-direction:column;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.h-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:stretch}.h-top{align-items:center}
h1{font-size:17px;margin:0 6px 0 0}h2{font-size:14px;margin:0 0 8px}
.mut{color:var(--mut)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the figures of the header: tiles with an icon, the figure big and the label small; the colour says the state */
.tiles{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto;min-width:0}
.tile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:center;min-width:118px;padding:7px 12px;border:1px solid var(--line2);border-radius:12px;color:var(--text);
background:linear-gradient(var(--panel2),var(--panel));box-shadow:inset 0 1px 0 var(--bev-hi),0 2px 0 var(--bev-lo);transition:filter .14s,box-shadow .14s,transform .08s,border-color .14s}
.tile .ico{grid-row:1/3;width:22px;height:22px;color:var(--mut)}
.tile b{font-size:20px;line-height:1.1;font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.tile b .tz{font-size:.62em;font-weight:600;color:var(--mut);white-space:nowrap}
.tile small{font-size:11.5px;line-height:1.2;color:var(--mut)}
.tile.wide{min-width:230px}.tile .qbar{grid-column:1/3;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}.tile .qbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}

/* ---------- the bar at the foot: the most important notice (all of them in a window), the connection, the allowance and the facts of this monitor ---------- */
/* the notices of the page (the red and yellow ones that used to sit on top) are still written into their six elements by the code that knows about them; the bar reads those elements
   and keeps the time each one was first seen, so the list of the window is in order of time and nothing else has to change */
const NOTE_SRC=[["err","bad",90],["netbar","bad",80],["offline","bad",70],["quota","warn",50],["hidden","warn",40],["restartbar","warn",30],["reduced","warn",20]];
const NSEEN={};var NOTES=[],SBINFO=null;
function readNotices(){
  const now=Date.now(),out=[];
  NOTE_SRC.forEach(([id,lv,rank])=>{const el=$(id);let on=false;if(el)on=(id==="netbar"||id==="quota"?!el.hidden:el.style.display==="block")&&!!el.textContent.trim();
    if(on){NSEEN[id]=NSEEN[id]||now;out.push({id:id,level:lv,rank:rank,text:el.textContent.trim(),at:NSEEN[id]})}else delete NSEEN[id]});
  if(typeof FRESHNOTE!=="undefined"&&FRESHNOTE){NSEEN.fresh=NSEEN.fresh||now;out.push({id:"fresh",level:FRESHNOTE.level,rank:95,text:FRESHNOTE.text,hint:FRESHNOTE.hint,at:NSEEN.fresh})}else delete NSEEN.fresh;
  if(OPENALERTS>0){NSEEN.alerts=NSEEN.alerts||now;out.push({id:"alerts",level:"warn",rank:60,text:T("ui.sb_open_alerts",{n:OPENALERTS}),at:NSEEN.alerts})}else delete NSEEN.alerts;
  return out.sort((a,b)=>(b.level==="bad")-(a.level==="bad")||b.rank-a.rank);
}
function renderBar(){
  const list=readNotices();NOTES=list;
  const lamp=$("sb-lamp"),txt=$("sb-text"),more=$("sb-more"),open=$("sb-open");
  if(!list.length){lamp.className="sb-lamp ok";txt.textContent=T("ui.sb_none");txt.title="";more.hidden=true;open.hidden=true}
  else{const top=list[0];lamp.className="sb-lamp "+top.level;txt.textContent=top.text;txt.title=top.hint||top.text;more.hidden=list.length<2;open.hidden=list.length<2;
    if(list.length>1){more.textContent=T("ui.sb_more",{n:list.length-1});more.title=T("ui.sb_open_all")}}
  if(!dlgs.notes.hidden)renderNotes();
  renderBarFacts();
}
function renderNotes(){
  const lv=$("notes-level").value,rows=NOTES.filter(n=>!lv||n.level===lv).slice().sort((a,b)=>b.at-a.at);
  $("notes-body").innerHTML=rows.length?`<ul>${rows.map(n=>`<li><time>${esc(dtime(n.at))}</time><span class="chip ${n.level}">${esc(T("ui.sb_lv_"+n.level))}</span><span>${esc(n.text)}</span></li>`).join("")}</ul>`:`<p class="mut">${esc(T("ui.sb_none"))}</p>`;
}
function openNotes(){renderNotes();dlgOpen("notes")}
/* the bottom bar says only what the boxes at the top do NOT say (connection, allowance, runs, last read and repositories are boxes at the top; the mode only when it is Low): the sentinels, the AI, the account, the version, the address, the sound and the clock; all in ONE line */
function renderBarFacts(){
  const set=(id,txt,title)=>{const e=$(id);if(!e)return;e.textContent=txt;e.title=title||""};
  {const low=typeof MODEDATA!=="undefined"&&MODEDATA&&MODEDATA.mode==="low";      /* Low is a warning (the figures can be old), not a figure of the boxes at the top: it is the only mode the bar says */
    set("sb-mode",low?T("ui.sb_mode",{mode:T("ui.mode_low")})+(MODEDATA.auto?T("ui.mode_auto"):""):"",low?T("ui.mode_low_t"):"")}
  const sents=SBINFO&&!LITE?SBINFO.sentinels||[]:[];
  set("sb-sent",LITE?"":T("ui.sb_sentinels",{n:sents.filter(s=>s.enabled).length,m:sents.length}),sents.map(s=>(T("ui.al_o_"+s.name)===("ui.al_o_"+s.name)?s.name:T("ui.al_o_"+s.name))+": "+T(s.enabled?"ui.sb_on":"ui.sb_off")).join(" · "));
  {const ai=SBINFO&&!LITE?SBINFO.ai:null;set("sb-ai",!ai||!ai.enabled?"":(ai.streams>0?T("ui.sb_ai_stream"):ai.connected?T("ui.sb_ai_on",{via:ai.via||"-",ago:agoText(ai.age_seconds)}):T("ui.sb_ai_off")),T("ui.sb_ai_t"))}
  set("sb-acc",T("ui.sb_account",{name:(ACC&&ACC.current)||OWNER||"-"}),T("ui.sb_account_t"));
  set("sb-ver","v"+(I18N.version||"")+" · "+T(LITE?"ui.sb_lite":"ui.sb_complete"),T("ui.sb_version_t"));
  if(SBINFO)set("sb-addr",(SBINFO.bind==="0.0.0.0"&&SBINFO.lan_address?SBINFO.lan_address:"127.0.0.1")+":"+SBINFO.port,T("ui.sb_addr_t",{local:"127.0.0.1:"+SBINFO.port,lan:(SBINFO.lan_address||"-")+":"+SBINFO.port}));
}
function agoText(s){s=Math.max(0,Math.round(s||0));return s>=3600?Math.floor(s/3600)+" h":s>=60?Math.floor(s/60)+" min":s+" s"}
function renderClock(){const e=$("sb-clock");if(!e)return;const now=new Date(),part=(o)=>{try{return now.toLocaleString(LOC(),{timeZone:TZ,...o})}catch(x){return now.toLocaleString(LOC(),o)}};
  $("ck-d").textContent=part({dateStyle:"medium"});$("ck-t").textContent=part({hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const z=(new Intl.DateTimeFormat(LOC(),{timeZone:TZ,timeZoneName:"short"}).formatToParts(now).find(x=>x.type==="timeZoneName")||{}).value||"";$("ck-z").textContent=z;
  e.title=part({dateStyle:"full",timeStyle:"long"})}
async function sbTick(){try{const r=await fetch("/api/statusbar",{cache:"no-store"});if(r.ok)SBINFO=await r.json()}catch(e){}renderBarFacts()}
{const watch=new MutationObserver(()=>{if(!watch.q){watch.q=requestAnimationFrame(()=>{watch.q=0;renderBar()})}});
  NOTE_SRC.forEach(([id])=>{const el=$(id);if(el)watch.observe(el,{attributes:true,childList:true,characterData:true,subtree:true})});
  $("sb-more").addEventListener("click",openNotes);$("sb-open").addEventListener("click",openNotes);$("notes-close").addEventListener("click",()=>dlgClose("notes"));$("notes-level").addEventListener("change",renderNotes);
  $("sb-sound").addEventListener("click",()=>{SOUND.muted=!SOUND.muted;try{store.set("am-sound",SOUND.muted?"off":"on")}catch(e){}soundUnlock(!SOUND.muted);soundLockPaint()});

  soundLockPaint();setInterval(soundLockPaint,2000);
  soundChip();renderBar();renderClock();setInterval(renderClock,1000);sbTick();setInterval(sbTick,30000);setInterval(renderBarFacts,15000)}

function fsSync(){const b=$("fs");if(!b)return;const on=!!document.fullscreenElement,k=on?"ui.fs_exit":"ui.fs_enter";b.setAttribute("aria-pressed",on);b.title=T(k);b.setAttribute("aria-label",T(k));const u=$("fs-ico");if(u)u.setAttribute("href",on?"#i-fullx":"#i-full")}
{const b=$("fs");if(b){if(!document.fullscreenEnabled)b.hidden=true;else{b.addEventListener("click",()=>{const r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})});document.addEventListener("fullscreenchange",fsSync);fsSync()}}}
