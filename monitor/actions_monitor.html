<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Actions</title>
<style>
:root{--bg:#0a0b10;--panel:#14161f;--panel2:#202430;--line:#2e3444;--line2:#424a5e;--text:#f1f5f9;--mut:#94a3b8;--ok:#22c55e;--bad:#ef4444;--run:#60a5fa;--warn:#f59e0b;--grey:#64748b;--ink:#0b0e14;--bev-hi:rgba(255,255,255,.16);--bev-lo:rgba(0,0,0,.6);--shadow:0 4px 18px rgba(0,0,0,.4);--glow:rgba(96,165,250,.55);--tex:rgba(255,255,255,.02)}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#e4e7ec;--panel:#f4f6f9;--panel2:#e9ecf1;--line:#c7ccd6;--line2:#a8b0be;--text:#16202c;--mut:#4b5563;--ok:#15803d;--bad:#b91c1c;--run:#1d4ed8;--warn:#b45309;--grey:#8c959f;--ink:#fff;--bev-hi:rgba(255,255,255,.7);--bev-lo:rgba(15,23,42,.25);--shadow:0 4px 18px rgba(15,23,42,.08);--glow:rgba(29,78,216,.45);--tex:rgba(15,23,42,.025)}}
:root[data-theme=light]{--bg:#e4e7ec;--panel:#f4f6f9;--panel2:#e9ecf1;--line:#c7ccd6;--line2:#a8b0be;--text:#16202c;--mut:#4b5563;--ok:#15803d;--bad:#b91c1c;--run:#1d4ed8;--warn:#b45309;--grey:#8c959f;--ink:#fff;--bev-hi:rgba(255,255,255,.7);--bev-lo:rgba(15,23,42,.25);--shadow:0 4px 18px rgba(15,23,42,.08);--glow:rgba(29,78,216,.45);--tex:rgba(15,23,42,.025)}
:root[data-theme=dark]{--bg:#0a0b10;--panel:#14161f;--panel2:#202430;--line:#2e3444;--line2:#424a5e;--text:#f1f5f9;--mut:#94a3b8;--ok:#22c55e;--bad:#ef4444;--run:#60a5fa;--warn:#f59e0b;--grey:#64748b;--ink:#0b0e14;--bev-hi:rgba(255,255,255,.16);--bev-lo:rgba(0,0,0,.6);--shadow:0 4px 18px rgba(0,0,0,.4);--glow:rgba(96,165,250,.55);--tex:rgba(255,255,255,.02)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,"Segoe UI","Hiragino Sans","Yu Gothic","Microsoft YaHei","PingFang SC",sans-serif;display:flex;flex-direction:column;overflow:hidden;background-image:linear-gradient(45deg,var(--tex) 25%,transparent 25%,transparent 50%,var(--tex) 50%,var(--tex) 75%,transparent 75%,transparent),radial-gradient(circle at center,var(--panel) 0%,var(--bg) 100%);background-size:4px 4px,100% 100%}
header{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0 6px 0 0}h2{font-size:14px;margin:0 0 8px}
.kpi{display:flex;gap:6px;align-items:baseline}.kpi b{font-size:19px;font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}
.sp{flex:1}
select,input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:inherit;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
button{background:linear-gradient(var(--panel2),var(--panel));color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 1px 0 var(--bev-hi),0 2px 0 var(--bev-lo),0 3px 7px rgba(0,0,0,.22);transition:filter .14s,box-shadow .14s,transform .08s,border-color .14s}
button:hover{filter:brightness(1.14);border-color:var(--run);box-shadow:inset 0 1px 0 var(--bev-hi),0 2px 0 var(--bev-lo),0 0 0 1px var(--run),0 0 14px var(--glow)}
button:active,button.pressing{transform:translateY(2px);filter:brightness(.92);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 0 0 1px var(--run)}
button:disabled{opacity:.5;cursor:default;filter:none;transform:none}
button.ib{padding:5px 8px;min-width:34px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--run);outline-offset:2px}
nav{display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);padding:7px 16px;position:relative}
nav button[aria-selected=true]{background:var(--bg);color:var(--text);border-color:var(--line);font-weight:600}
nav .dot[hidden]{display:none}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:999px;font-size:11px;color:#fff;background:var(--bad);text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
#err{display:none;background:var(--bad);color:#fff;padding:6px 18px}
#reduced{display:none;background:var(--warn);color:#fff;padding:6px 18px}
#offline{display:none;background:var(--bad);color:#fff;padding:6px 18px;font-weight:600}
main{flex:1;min-height:0;padding:12px 18px}
.tab{display:none;height:100%;min-height:0}.tab.on{display:grid}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;min-height:0;display:flex;flex-direction:column}
section>.body{flex:1;min-height:0;overflow:auto}
.card{border:1px solid var(--line);border-left:4px solid var(--run);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.card.stuck{border-left-color:var(--bad)}.card.queued{border-left-color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
a{color:var(--run);text-decoration:none}a:hover{text-decoration:underline}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.b-success{background:var(--ok)}.b-failure,.b-timed_out,.b-startup_failure{background:var(--bad)}.b-cancelled,.b-skipped{background:var(--grey)}.b-run{background:var(--run)}.b-queued{background:var(--warn)}
.job{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:10px;align-items:center;margin:5px 0;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:2px}.bar i{display:block;height:100%;background:var(--run);transition:width .4s}
.bar i.done{background:var(--ok)}.bar i.fail{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel)}
svg{display:block;max-width:none}svg text{fill:var(--mut);font-size:12px}
.rrow{display:grid;grid-template-columns:minmax(120px,1.6fr) minmax(80px,2fr) 96px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.rbar i{display:block;height:100%}.rval{text-align:right;white-space:nowrap}
.alert{padding:7px 10px;border:1px solid var(--bad);border-radius:8px;margin-bottom:6px}.alert.warn{border-color:var(--warn)}
/* tabs: each one fits the screen */
#t-now{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px}
#t-charts{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);grid-template-rows:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
#t-charts .wide{grid-column:1/-1}
#t-hist,#t-repos{grid-template-rows:minmax(0,1fr)}
/* Sentinel */
#t-sent{grid-template-columns:minmax(0,1fr) minmax(0,2.1fr);gap:12px}
#t-sent .lcol{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
#t-sent .lcol section:first-child{flex:1.3 1 0}#t-sent .lcol section:last-child{flex:1 1 0}
#s-err{display:none;background:var(--bad);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:8px;font-weight:600}
.sems{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sem{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--text)}
.sem i{width:11px;height:11px;border-radius:50%;background:var(--grey);display:inline-block}
.sem.ok i{background:var(--ok)}.sem.warn i{background:var(--warn)}.sem.bad i{background:var(--bad)}.sem.info i{background:var(--run)}
.pline{padding:6px 10px;border-left:4px solid var(--grey);margin-bottom:6px;background:var(--bg);border-radius:0 6px 6px 0}
.pline.ok{border-color:var(--ok)}.pline.warn{border-color:var(--warn)}.pline.bad{border-color:var(--bad)}.pline.info{border-color:var(--run)}
.pline.head{font-size:15px;font-weight:600}
.spk{display:grid;grid-template-columns:minmax(90px,1fr) 120px 56px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg)}
summary{cursor:pointer;padding:6px 10px;display:flex;gap:8px;align-items:center;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"\25B8";color:var(--mut)}details[open]>summary::before{content:"\25BE"}
details>.dbody{padding:4px 10px 10px;overflow:auto;max-height:46vh}
.chip{display:inline-block;padding:0 7px;border-radius:999px;font-size:12px;border:1px solid var(--line);margin:1px 2px}
.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.ok{border-color:var(--ok);color:var(--ok)}
.ai{margin:4px 0 8px;padding:6px 10px;border:1px dashed var(--warn);border-radius:6px;white-space:pre-wrap;font-size:13px}
.ai small{display:block;color:var(--warn);font-weight:600}
td.wrap{white-space:normal;min-width:180px}
[hidden]{display:none!important}
.kclick{cursor:pointer;border-radius:6px;padding:0 4px}.kclick:hover{outline:1px solid var(--run)}
button[aria-pressed=true]{border-color:var(--run);color:var(--run);font-weight:600}
#g-list{border-color:var(--run);color:var(--run);cursor:pointer}
.rl{cursor:pointer;text-decoration:underline dotted}
#rp{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.25);padding:14px 16px;overflow:auto;z-index:20}
#rp h2{font-size:16px;display:flex;gap:8px;align-items:center}#rp h3{font-size:13px;margin:12px 0 4px;color:var(--mut);text-transform:uppercase}
#rp .x{margin-left:auto}
#t-now.dense .card{padding:3px 8px;margin-bottom:3px;font-size:12px}#t-now.dense .job{margin:1px 0;font-size:11px;grid-template-columns:minmax(90px,1fr) 2fr auto}
#t-now.dense .bar{height:4px}#t-now.dense h3{margin:4px 0 2px!important}#t-now.dense .alert{padding:2px 6px;margin-bottom:2px;font-size:12px}
.dif{display:flex;flex-wrap:wrap;gap:2px}.chip.new{border-color:var(--bad);color:var(--bad)}.chip.gone{border-color:var(--ok);color:var(--ok);text-decoration:line-through}
@media (max-width:1000px){#t-sent{grid-template-columns:minmax(0,1fr);overflow:auto}#t-now{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr)}#t-charts{grid-template-columns:minmax(0,1fr);grid-template-rows:none;overflow:auto}#t-charts section{min-height:260px}body{overflow:auto}}

/* icons: inline SVG from the sprite, drawn with the colour of the text */
.ico{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button .ico{width:16px;height:16px}
button[aria-pressed=true] .ico{color:var(--run)}
.lbl{white-space:nowrap}
/* the relief of the dashboard: cards, tracks and fills of the bars, the ring */
section{box-shadow:var(--shadow);border-radius:12px}
.card{box-shadow:inset 0 1px 0 var(--bev-hi)}
.bar,.rbar{box-shadow:inset 0 1px 2px rgba(0,0,0,.38)}
.bar i,.rbar i{background-image:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%,rgba(0,0,0,.18))}
#donut svg circle,#donut svg path{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.badge{box-shadow:inset 0 1px 0 var(--bev-hi),0 1px 2px rgba(0,0,0,.3)}
.sem{box-shadow:inset 0 1px 0 var(--bev-hi),0 1px 2px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.bar i,.rbar i{animation:grow .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
/* settings: sub-tabs, search, blocks with a main switch, fixed save bar */
#t-cfg{grid-template-rows:minmax(0,1fr)}
#t-cfg section>.body{padding-right:0;display:flex;flex-direction:column;overflow:hidden}
.cfg-note{margin:0 0 10px;color:var(--mut)}
.cfg-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;border-bottom:1px solid var(--line);margin-bottom:10px}
#cfg-tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 520px}
#cfg-tabs button{border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);padding:6px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
#cfg-tabs button[aria-selected=true]{background:var(--bg);color:var(--text);border-color:var(--line);font-weight:600;box-shadow:inset 0 1px 0 var(--bev-hi)}
#cfg-tabs .cnt{display:none;min-width:18px;padding:0 5px;border-radius:999px;font-size:11px;color:#fff;background:var(--warn);text-align:center}
#cfg-tabs .cnt.on{display:inline-block}
#cfg-search{min-width:210px;margin-bottom:6px}
#cfg-panels{flex:1;min-height:0;overflow:auto;padding:2px 6px 8px 0}
#cfg-panels [role=tabpanel][hidden]{display:none}
#cfg-none{display:none;color:var(--mut);padding:12px}
.cfg-group{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;background:var(--bg);box-shadow:inset 0 1px 0 var(--bev-hi)}
.cfg-group>h3{margin:0;padding:8px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.cfg-group.off .cfg-grid .cfg-f:not(.master){opacity:.45}
.cfg-offnote{display:none;padding:6px 12px 0;color:var(--mut);font-size:12px}.cfg-group.off .cfg-offnote{display:block}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 18px;padding:10px 12px}
.cfg-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.cfg-f label{font-weight:600;font-size:13px}
.cfg-f .inl{display:flex;gap:8px;align-items:center}.cfg-f .inl input,.cfg-f .inl select{flex:1;min-width:0}
.cfg-f .unit{color:var(--mut);font-size:12px;white-space:nowrap}
.cfg-f input[type=number],.cfg-f input[type=text],.cfg-f select,.cfg-f textarea{width:100%}
.cfg-f textarea{min-height:64px;font:inherit;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:12px}
.cfg-f .help{font-size:12px;color:var(--mut)}
.cfg-f .hint{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cfg-f.dirty input,.cfg-f.dirty select,.cfg-f.dirty textarea{border-color:var(--warn)}
.cfg-f.bad input,.cfg-f.bad select,.cfg-f.bad textarea{border-color:var(--bad)}
.cfg-f.hit label{text-decoration:underline}
.tq-verified td:first-child{box-shadow:inset 3px 0 0 var(--ok)}.tq-unknown td:first-child{box-shadow:inset 3px 0 0 var(--grey)}.tq-failed td:first-child{box-shadow:inset 3px 0 0 var(--bad)}.tq-failed td{background:rgba(239,68,68,.08)}
.rdy{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}.rdy-chip{display:inline-flex;gap:5px;align-items:center;padding:1px 8px;border:1px solid var(--line2);border-radius:999px;font-size:12px;box-shadow:inset 0 1px 0 var(--bev-hi)}.rdy-chip i{width:8px;height:8px;border-radius:50%;background:var(--grey)}.rdy-chip.ok i{background:var(--ok)}.rdy-chip.warn i{background:var(--warn)}.rdy-chip.bad i{background:var(--bad)}
.pill{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line2)}
.pill.restart{border-color:var(--warn);color:var(--warn)}.pill.live{border-color:var(--ok);color:var(--ok)}.pill.secure{border-color:var(--run);color:var(--run)}
.sw{display:flex;align-items:center;gap:10px}
.sw input{appearance:none;width:42px;height:22px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);position:relative;cursor:pointer;padding:0;box-shadow:inset 0 1px 3px rgba(0,0,0,.45);transition:background .15s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:linear-gradient(#fff,#cbd5e1);box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .15s}
.sw input:checked{background:var(--ok)}.sw input:checked::after{transform:translateX(20px)}
.sw input:hover{box-shadow:inset 0 1px 3px rgba(0,0,0,.45),0 0 10px var(--glow)}
.eco-list{display:flex;flex-wrap:wrap;gap:6px 14px}.eco-list label{font-weight:400;display:inline-flex;gap:5px;align-items:center}
.cfg-bar{flex:none;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0 0;border-top:1px solid var(--line);background:var(--panel)}
#cfg-msg{padding:4px 10px;border-radius:8px}#cfg-msg.ok{color:var(--ok)}#cfg-msg.err{color:var(--bad)}
#cfg-restart{display:none;background:var(--warn);color:#fff;padding:6px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
.ifrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 12px}
.ia{display:inline-flex;vertical-align:middle;align-items:center;padding:3px 7px;margin-left:4px;border:1px solid var(--line2);border-radius:8px;color:var(--text);
background:linear-gradient(var(--panel2),var(--panel));box-shadow:inset 0 1px 0 var(--bev-hi),0 2px 0 var(--bev-lo);transition:filter .14s,box-shadow .14s,transform .08s}
.ia:hover{text-decoration:none;filter:brightness(1.14);border-color:var(--run);box-shadow:inset 0 1px 0 var(--bev-hi),0 2px 0 var(--bev-lo),0 0 0 1px var(--run),0 0 14px var(--glow)}
.ia:active{transform:translateY(2px);filter:brightness(.92);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
/* life of the bars and of what is red or running: a discreet pulse, a moving light, a lift on hover, smooth changes of width; none of it when the user asks for less motion */
.rrow:hover .rbar,.spk:hover .rbar,.job:hover .bar{outline:1px solid var(--run);outline-offset:1px}
.rrow:hover .rbar i,.spk:hover .rbar i,.job:hover .bar i{filter:brightness(1.25)}
.rrow,.spk,.job{border-radius:6px;transition:background .15s}.rrow:hover,.spk:hover,.job:hover{background:var(--panel2)}
.rbar i,.bar i{transition:width .5s cubic-bezier(.2,.7,.2,1),filter .15s}
@media (prefers-reduced-motion:no-preference){
@keyframes pulse-bad{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55),inset 0 1px 0 var(--bev-hi)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0),inset 0 1px 0 var(--bev-hi)}}
@keyframes pulse-run{0%,100%{box-shadow:0 0 0 0 rgba(96,165,250,.5),inset 0 1px 0 var(--bev-hi)}50%{box-shadow:0 0 0 4px rgba(96,165,250,0),inset 0 1px 0 var(--bev-hi)}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
#alerts .badge.b-failure,#alerts .badge.b-timed_out,#alerts .badge.b-startup_failure,#now .badge.b-failure{animation:pulse-bad 2.4s ease-out infinite}
#now .badge.b-run{animation:pulse-run 2.4s ease-out infinite}
.sem.bad i,nav .dot:not([hidden]){animation:pulse-dot 1.8s ease-in-out infinite}
.bar i:not(.done):not(.fail){background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%),linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%,rgba(0,0,0,.18));background-size:200% 100%,100% 100%;animation:shimmer 2s linear infinite}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
const I18N=/*I18N_DATA*/null||{default:"en",langs:["en"],names:{en:"English"},html:{en:"en"},locale:{en:"en-GB"},catalogues:{en:{}},ecosystems:{},owner:"",version:""};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const QS=new URLSearchParams(location.search);   // deep link: ?tab=sent&repo=NAME&lang=de (the old #tab still works)
var LANG=[QS.get("lang"),store.get("am-lang"),I18N.default,"en"].find(x=>x&&I18N.langs.includes(x));
function T(k,v){const c=I18N.catalogues[LANG]||{},e=I18N.catalogues.en||{};let s=c[k]!==undefined?c[k]:e[k];if(s===undefined)return k;if(v)s=s.replace(/\{(\w+)\}/g,(m,n)=>v[n]!==undefined?v[n]:m);return s}
const LOC=()=>I18N.locale[LANG]||"en-GB";
const OWNER=I18N.owner||"";
function applyStatic(){
  document.documentElement.lang=I18N.html[LANG]||LANG;document.title=T("ui.title")+(I18N.version?" v"+I18N.version:"");const aboutEl=document.getElementById("about");if(aboutEl&&I18N.author)aboutEl.textContent=T("ui.about",{author:I18N.author,license:I18N.license});const verEl=document.getElementById("ver");if(verEl)verEl.textContent=I18N.version?"v"+I18N.version:"";
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=T(e.dataset.i18n)});
  document.querySelectorAll("[data-i18n-title]").forEach(e=>{e.title=T(e.dataset.i18nTitle)});
  document.querySelectorAll("[data-i18n-aria]").forEach(e=>{e.setAttribute("aria-label",T(e.dataset.i18nAria))});
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>{e.placeholder=T(e.dataset.i18nPh)});
  const lq="?lang="+LANG;$("lnk-txt").href="/api/sentinel/parte.txt"+lq;$("lnk-md").href="/api/sentinel/parte.txt?fmt=md&lang="+LANG;
}
var DATA=null;
window.addEventListener("error",e=>{const b=document.getElementById("err");b.style.display="block";b.textContent=T("ui.err_page",{msg:e.message,line:e.lineno})});
const $=id=>document.getElementById(id);
/* life of the page: figures that count up, short and cheap (one requestAnimationFrame per figure), and nothing at all when the user asks for less motion */
const REDUCED=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
function kSet(id,v){
  const el=$(id);if(!el)return;
  if(typeof v!=="number"||!isFinite(v)||REDUCED.matches||!el.isConnected){el.textContent=v;el._v=typeof v==="number"?v:undefined;return}
  const from=typeof el._v==="number"?el._v:0,to=v;el._v=to;
  if(el._raf)cancelAnimationFrame(el._raf);
  if(from===to){el.textContent=to;return}
  const t0=performance.now(),dur=Math.min(700,250+Math.abs(to-from)*12);
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step);else el.textContent=to};
  el._raf=requestAnimationFrame(step);
}
/* hovering a bar or a row of a chart shows its text as a tooltip too (the rows are drawn by the render functions, so it is done after drawing) */
function tipRows(){document.querySelectorAll(".rrow,.spk,.job").forEach(r=>{if(!r.title){const t=r.textContent.replace(/\s+/g," ").trim();if(t)r.title=t}})}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,u=[T("ui.u_h"),T("ui.u_min"),T("ui.u_s")];return h?`${h} ${u[0]} ${m} ${u[1]}`:m?`${m} ${u[1]} ${x} ${u[2]}`:`${x} ${u[2]}`};
const hora=t=>t?new Date(t).toLocaleString(LOC(),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const clock=(t,o)=>new Date(t).toLocaleTimeString(LOC(),o);
const ago=t=>t?fmt((Date.now()-new Date(t).getTime())/1000):"";
const COLORS={success:"var(--ok)",failure:"var(--bad)",timed_out:"var(--bad)",startup_failure:"var(--bad)",cancelled:"var(--grey)",skipped:"var(--grey)"};
const BAD=["failure","timed_out","startup_failure"];
const label=r=>r.status!=="completed"?(r.status==="in_progress"?T("ui.st_running"):T("ui.st_queued")):(r.conclusion||"?");
const badge=r=>{const c=r.status!=="completed"?(r.status==="in_progress"?"run":"queued"):(r.conclusion||"skipped");return `<span class="badge b-${c}">${esc(label(r))}</span>`};
const yn=b=>b?T("ui.yes"):T("ui.no");
const qlang=()=>"lang="+encodeURIComponent(LANG);

var HOTONLY=false;
$("hotonly").addEventListener("click",async()=>{
  try{const r=await fetch("/api/hot-only",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on:!HOTONLY})});const j=await r.json();
    if(!j.ok)throw new Error(j.error||r.status);tick()}
  catch(e){$("err").style.display="block";$("err").textContent=T("ui.err_hotonly",{msg:e.message})}
});
/* dense view of the Now tab */
function applyDense(on){$("t-now").classList.toggle("dense",on);$("dense").setAttribute("aria-pressed",on);$("dense-lbl").textContent=T("ui.dense",{state:yn(on)})}
var DENSE=store.get("am-dense")==="1";
$("dense").addEventListener("click",()=>{DENSE=!DENSE;store.set("am-dense",DENSE?"1":"0");applyDense(DENSE)});
/* theme: auto -> light -> dark */
const THEMES=["auto","light","dark"];
function applyTheme(t){if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);$("theme-lbl").textContent=T("ui.theme",{name:T("ui.theme_"+t)});$("theme-use").setAttribute("href","#i-"+(t==="auto"?"auto":t==="light"?"sun":"moon"));$("theme").title=T("ui.ic_theme",{name:T("ui.theme_"+t)})}
const asked=new URLSearchParams(location.search).get("theme");
let theme=THEMES.includes(asked)?asked:(THEMES.includes(store.get("am-theme"))?store.get("am-theme"):"auto");
$("theme").addEventListener("click",()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];store.set("am-theme",theme);applyTheme(theme);if(DATA)render(DATA)});
/* language selector: saved in the browser, the whole page and the server texts are refreshed */
I18N.langs.forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=I18N.names[l]||l;$("lang").appendChild(o)});
$("lang").value=LANG;
$("lang").addEventListener("change",()=>{LANG=$("lang").value;store.set("am-lang",LANG);refreshLanguage()});
function fillEco(){
  const sel=$("g-eco"),cur=FILTER.eco;sel.innerHTML="";
  [["",T("ui.f_all")],...Object.keys(I18N.ecosystems).map(k=>[k,I18N.ecosystems[k]]),["other",T("ui.f_other")]].forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=n;sel.appendChild(o)});
  sel.value=cur;
}
function refreshLanguage(){
  applyStatic();applyTheme(theme);applyDense(DENSE);fillEco();
  if(DATA)render(DATA);
  sentTick();diffTick();if(CFG.groups.length)cfgBuild({groups:CFG.groups.map(g=>({id:g.id,fields:g.fields,blocks:g.blocks.map(b=>({...b,fields:b.fields.map(f=>({...f,value:f.type==="status"?f.value:CFG.cur[f.key]}))}))})),restart_pending:CFG.restart,backups:parseInt(($("cfg-backups").textContent.match(/\d+/)||[0])[0])});
}

    else if(f.type==="int"||f.type==="float"){input=document.createElement("input");input.type="number";input.id=id;input.min=f.min;input.max=f.max;input.step=f.type==="float"?"0.1":"1";input.value=f.value==null?"":f.value;
      sub.push(T("ui.cfg_range",{min:f.min,max:f.max}));input.addEventListener("input",()=>onchange(input.value===""?null:Number(input.value)));inl.appendChild(input)}
    else if(f.type==="enum"){input=document.createElement("select");input.id=id;f.enum.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v===""?"–":(I18N.names[v]||v);input.appendChild(o)});input.value=f.value==null?"":f.value;
      input.addEventListener("change",()=>onchange(input.value));inl.appendChild(input)}
    else if(f.type==="names"||(f.type==="repos"&&Array.isArray(f.value))){input=document.createElement("textarea");input.id=id;input.value=(f.value||[]).join("\n");sub.push(T("ui.cfg_list_hint"));
      input.addEventListener("input",()=>onchange(input.value.split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean)));inl.appendChild(input)}
    else if(f.type==="repos"){input=document.createElement("input");input.type="text";input.id=id;input.value="all";input.addEventListener("input",()=>{const v=input.value.trim();onchange(v==="all"||v===""?"all":v.split(/[\s,]+/).filter(Boolean))});inl.appendChild(input)}
    else if(f.type==="filegroups"){input=document.createElement("textarea");input.id=id;input.value=(f.value||[]).map(g=>g.join(" ; ")).join("\n");sub.push(T("ui.cfg_files_hint"));
      input.addEventListener("input",()=>onchange(input.value.split(/\n/).map(l=>l.split(";").map(x=>x.trim()).filter(Boolean)).filter(g=>g.length)));inl.appendChild(input)}
    else if(f.type==="intmap"){input=document.createElement("textarea");input.id=id;input.value=Object.entries(f.value||{}).map(([k,v])=>k+" = "+v).join("\n");sub.push(T("ui.cfg_map_hint"));
      input.addEventListener("input",()=>{const o={};input.value.split(/\n/).forEach(l=>{const m=l.match(/^\s*([A-Za-z0-9._-]+)\s*=\s*(-?\d+)\s*$/);if(m)o[m[1]]=Number(m[2])});onchange(o)});inl.appendChild(input)}
    else if(f.type==="sources"){input=document.createElement("textarea");input.id=id;input.value=JSON.stringify(f.value||[],null,1);sub.push(T("ui.cfg_sources_hint"));
      input.addEventListener("input",()=>{try{const v=JSON.parse(input.value||"[]");wrap.classList.remove("bad");onchange(v)}catch(e){wrap.classList.add("bad");cfgMsg("err",T("ui.cfg_json_invalid"))}});inl.appendChild(input)}
    else if(f.type==="eco"){input=document.createElement("div");input.className="eco-list";input.id=id;
      const all=f.value==="all"||f.value==null,chosen=new Set(Array.isArray(f.value)?f.value:[]);
      const mk=(val,text,checked)=>{const l=document.createElement("label");const c=document.createElement("input");c.type="checkbox";c.value=val;c.checked=checked;l.appendChild(c);l.appendChild(document.createTextNode(" "+text));input.appendChild(l);return c};
      const ca=mk("all",T("ui.cfg_eco_all"),all),cs=(f.choices||[]).map(k=>mk(k,I18N.ecosystems[k]||k,!all&&chosen.has(k)));
      const upd=()=>onchange(ca.checked?"all":cs.filter(c=>c.checked).map(c=>c.value));
      ca.addEventListener("change",()=>{if(ca.checked)cs.forEach(c=>c.checked=false);upd()});cs.forEach(c=>c.addEventListener("change",()=>{if(c.checked)ca.checked=false;else if(!cs.some(x=>x.checked))ca.checked=true;upd()}));inl.appendChild(input)}
    else{input=document.createElement("input");input.type="text";input.id=id;input.value=f.value==null?"":f.value;if(f.type==="path")sub.push(T("ui.cfg_path_hint"));input.maxLength=260;
      input.addEventListener("input",()=>onchange(input.value));inl.appendChild(input)}
    if(unit){const u=document.createElement("span");u.className="unit";u.textContent=unit;inl.appendChild(u)}
    wrap.appendChild(inl);
  }
  const help=document.createElement("div");help.className="help";help.textContent=T(f.help);wrap.appendChild(help);
  const hint=document.createElement("div");hint.className="hint";
  if(f.type!=="status"){const pill=document.createElement("span");pill.className="pill "+(f.restart?"restart":"live");pill.textContent=f.restart?T("ui.cfg_restart"):T("ui.cfg_live");hint.appendChild(pill)}
  if(f.secure){const p2=document.createElement("span");p2.className="pill secure";p2.textContent=T("ui.cfg_secure");hint.appendChild(p2)}
  sub.forEach(x=>{const s=document.createElement("span");s.textContent=x;hint.appendChild(s)});wrap.appendChild(hint);
  return wrap;
}
function cfgShowTab(id,focus){
  const ids=cfgTabIds();if(!ids.includes(id))id="interface";CFG.tab=id;store.set("am-cfg-tab",id);
  ids.forEach(x=>{const b=$("cft-"+x),p=x==="interface"?$("cfp-interface"):$("cfp-"+x);if(b){b.setAttribute("aria-selected",x===id);b.tabIndex=x===id?0:-1}if(p)p.hidden=x!==id});
  if(focus&&$("cft-"+id))$("cft-"+id).focus();
}
function cfgBuildTabs(){
  const bar=$("cfg-tabs");bar.innerHTML="";
  cfgTabIds().forEach(id=>{const b=document.createElement("button");b.type="button";b.id="cft-"+id;b.setAttribute("role","tab");b.setAttribute("aria-controls","cfp-"+id);b.setAttribute("aria-selected","false");
    const t=document.createElement("span");t.textContent=cfgTabName(id);b.appendChild(t);const c=document.createElement("span");c.className="cnt";b.appendChild(c);bar.appendChild(b)});
}
$("cfg-tabs").addEventListener("click",e=>{const b=e.target.closest("button[role=tab]");if(b){$("cfg-search").value="";cfgFilter();cfgShowTab(b.id.slice(4))}});
$("cfg-tabs").addEventListener("keydown",e=>{const ids=cfgTabIds(),i=ids.indexOf(CFG.tab);let n=null;
  if(e.key==="ArrowRight")n=(i+1)%ids.length;else if(e.key==="ArrowLeft")n=(i-1+ids.length)%ids.length;else if(e.key==="Home")n=0;else if(e.key==="End")n=ids.length-1;
  if(n!==null){e.preventDefault();cfgShowTab(ids[n],true)}});
function cfgFilter(){
  const q=$("cfg-search").value.trim().toLowerCase(),panels=document.querySelectorAll("#cfg-form [role=tabpanel]");let hits=0;
  if(!q){document.querySelectorAll("#cfg-form .cfg-f,#cfg-form .cfg-group").forEach(x=>{x.style.display="";x.classList.remove("hit")});$("cfg-none").style.display="none";cfgShowTab(CFG.tab);return}
  panels.forEach(p=>{p.hidden=false;p.querySelectorAll(".cfg-group").forEach(b=>{let any=false;b.querySelectorAll(".cfg-f").forEach(f=>{const hay=(cfgLabel(f.dataset.key)+" "+T(CFG.meta[f.dataset.key].help)+" "+f.dataset.key).toLowerCase(),ok=hay.includes(q);f.style.display=ok?"":"none";f.classList.toggle("hit",ok);if(ok){any=true;hits++}});b.style.display=any?"":"none"})});
  $("cfp-interface").hidden=true;$("cfg-none").style.display=hits?"none":"block";
}
$("cfg-search").addEventListener("input",cfgFilter);
async function cfgExtras(){
  const ai=document.getElementById("cfp-ai");
  if(ai&&!ai.querySelector(".ai-extra")){
    const box=document.createElement("div");box.className="cfg-group ai-extra";
    box.innerHTML=`<h3></h3><div class="cfg-grid" style="grid-template-columns:1fr"><div class="help" id="ai-premium"></div><div class="inl"><button type="button" id="ai-test"></button><span id="ai-test-out" class="mut"></span><span id="ai-usage" class="mut"></span></div><div><b id="ai-log-h"></b> <button type="button" id="ai-unlock"></button><div id="ai-log" class="mut" style="font-size:12px"></div></div></div>`;
    ai.appendChild(box);
    box.querySelector("h3").textContent=T("ui.ai_log_h");$("ai-premium").textContent=T("ui.ai_premium");$("ai-test").textContent=T("ui.ai_test");$("ai-unlock").textContent=T("ui.ai_unlock");$("ai-log-h").textContent="";
    $("ai-test").addEventListener("click",async()=>{try{const r=await fetch("/api/ai/test",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});const j=await r.json();$("ai-test-out").textContent=j.ok?T("ui.ai_test_ok",{ms:j.ms}):(j.error||"");if(j.daily_limit!=null)$("ai-usage").textContent=T("ui.ai_usage",{n:j.used_today,limit:j.daily_limit})}catch(e){$("ai-test-out").textContent=String(e)}});
    $("ai-unlock").addEventListener("click",async()=>{await fetch("/api/ai/actions/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});cfgExtras()});
  }
  if($("ai-log")){try{const r=await fetch("/api/ai/actions",{cache:"no-store"});const j=await r.json();$("ai-log").innerHTML=(j.log||[]).length?j.log.map(x=>`<div>${esc(x.at)} · ${esc(x.command)} · ${x.code===0?esc(T("ui.ai_run_ok")):esc(T("ui.ai_run_failed",{code:x.code}))}</div>`).join(""):esc(T("ui.ai_log_none"));
    if(j.ai)$("ai-usage").textContent=T("ui.ai_usage",{n:j.ai.used_today,limit:j.ai.daily_limit})}catch(e){}}
  const nt=document.getElementById("cfp-notify");
  if(nt&&!nt.querySelector(".nt-extra")){
    const box=document.createElement("div");box.className="cfg-group nt-extra";box.innerHTML=`<div class="cfg-grid" style="grid-template-columns:1fr"><div class="inl">${["telegram","discord","slack","matrix","mqtt","http_local"].map(c=>`<button type="button" data-nt="${c}"></button>`).join("")}<span id="nt-out" class="mut"></span></div></div>`;
    nt.appendChild(box);box.querySelectorAll("button[data-nt]").forEach(b=>{b.textContent=T("ui.notify_test")+" · "+T("ui.cfg_b_ch_"+b.dataset.nt);b.addEventListener("click",async()=>{try{const r=await fetch("/api/notify/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channel:b.dataset.nt})});const j=await r.json();$("nt-out").textContent=j.ok?T("ui.notify_test_ok"):T("ui.notify_test_fail",{reason:j.reason||""})}catch(e){$("nt-out").textContent=String(e)}})})
  }
}
function cfgBuild(j){
  CFG.groups=j.groups;CFG.orig={};CFG.cur={};CFG.meta={};CFG.restart=j.restart_pending||[];
  const form=$("cfg-form");form.innerHTML="";
  j.groups.forEach(g=>{
    const panel=document.createElement("div");panel.id="cfp-"+g.id;panel.setAttribute("role","tabpanel");panel.setAttribute("aria-labelledby","cft-"+g.id);panel.hidden=true;
    g.blocks.forEach(blk=>{
      const box=document.createElement("div");box.className="cfg-group";const h=document.createElement("h3");h.textContent=T(blk.title_key);box.appendChild(h);
      if(blk.fields.some(f=>f.master)){const n=document.createElement("div");n.className="cfg-offnote";n.textContent=T("ui.cfg_master_off");box.appendChild(n)}
      if(g.id==="outputs"&&blk.id==="prometheus"){const p=document.createElement("p");p.className="cfg-note";p.style.padding="6px 12px 0";p.textContent=T("ui.cfg_outputs_hint");box.appendChild(p)}
      const grid=document.createElement("div");grid.className="cfg-grid";
      blk.fields.forEach(f=>{CFG.meta[f.key]=f;if(f.type!=="status"){CFG.orig[f.key]=f.value==null?(f.type==="int"||f.type==="float"?null:f.value):f.value;if(f.type==="names")CFG.orig[f.key]=f.value||[];CFG.cur[f.key]=JSON.parse(JSON.stringify(CFG.orig[f.key]===undefined?null:CFG.orig[f.key]))}grid.appendChild(cfgField(f))});
      box.appendChild(grid);panel.appendChild(box);
    });
    form.appendChild(panel);
  });
  cfgBuildTabs();cfgShowTab(CFG.tab);
  const r=$("cfg-restart");const n=CFG.restart.length;r.style.display=n?"block":"none";r.textContent=n?T("ui.cfg_restart_banner",{n:n}):"";
  $("cfg-backups").textContent=T("ui.cfg_backups",{n:j.backups||0});cfgRefreshButtons();cfgFilter();cfgExtras();
}
async function cfgLoad(){try{const r=await fetch("/api/settings?"+qlang(),{cache:"no-store"});const j=await r.json();if(j.ok)cfgBuild(j)}catch(e){$("cfg-msg").className="err";$("cfg-msg").textContent=T("ui.err_monitor",{msg:e})}}
function cfgMsg(cls,t){const m=$("cfg-msg");m.className=cls;m.textContent=t}
$("cfg-save").addEventListener("click",async()=>{
  const changes={};cfgDirty().forEach(k=>{changes[k]=CFG.cur[k]});if(!Object.keys(changes).length){cfgMsg("",T("ui.cfg_nochange"));return}
  try{
    const r=await fetch("/api/settings?"+qlang(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({changes})});const j=await r.json();
    if(!j.ok){const why=Object.keys(j.errors||{}).map(k=>(k==="_"?"":cfgLabel(k)+" – ")+T("ui.cfg_err_"+j.errors[k])).join("; ");cfgMsg("err",T("ui.cfg_not_saved",{why:why}));
      document.querySelectorAll("#cfg-form .cfg-f").forEach(f=>f.classList.toggle("bad",!!(j.errors||{})[f.dataset.key]));return}
    cfgMsg("ok",j.restart&&j.restart.length?T("ui.cfg_saved_restart",{keys:j.restart.map(cfgLabel).join(", ")}):T("ui.cfg_saved",{n:j.changed.length}));await cfgLoad();
  }catch(e){cfgMsg("err",T("ui.err_monitor",{msg:e}))}
});
$("cfg-discard").addEventListener("click",()=>{cfgLoad();cfgMsg("","")});
$("cfg-open").addEventListener("click",()=>showTab("cfg"));
/* every button gives a short "pressed" feedback also for the keyboard (the mouse uses :active) */
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.tagName==="BUTTON"){e.target.classList.add("pressing")}});
document.addEventListener("keyup",e=>{if(e.target.tagName==="BUTTON")e.target.classList.remove("pressing")});
applyStatic();applyTheme(theme);applyDense(DENSE);cfgLoad();
diffTick();setInterval(diffTick,60000);
sentTick();setInterval(sentTick,15000);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(DATA)render(DATA)},200)});
tick();setInterval(tick,10000);
</script>
