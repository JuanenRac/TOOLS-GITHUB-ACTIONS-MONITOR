# Prometheus configuration for the monitor: it scrapes /metrics every 30 seconds, loads the alert rules and talks to the local Alertmanager.
# Change the port 8765 if the monitor does not use it. /metrics needs outputs.prometheus.enabled in the settings of the monitor.
global:
  scrape_interval: 30s
rule_files:
  - ghamon_alert_rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: github-actions-monitor
    static_configs:
      - targets: ["127.0.0.1:8765"]
